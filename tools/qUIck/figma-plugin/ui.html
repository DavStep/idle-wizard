        const workCtx = work.getContext("2d", { willReadFrequently: true });
        workCtx.drawImage(image, 0, 0);
        const { data } = workCtx.getImageData(0, 0, work.width, work.height);
        return buildAutoMetadataFromRgba(data, work.width, work.height, width, height, assetHash, nodeName);
      }

      function maybeApplyDetectedAutoMetadata(metadata, forceApply) {
        lastDetectedAutoMetadata = metadata;
        if (!selectedNodeInfo || !selectedNodeInfo.hasSelection || !selectedNodeInfo.isNine) {
          return;
        }
        if (!forceApply && sliceDirtySinceSelection) {
          updateNineMeta();
          return;
        }
        if (resolvedMetadata && resolvedMetadata.source === "manual" && !forceApply) {
          updateNineMeta();
          return;
        }

        resolvedMetadata = metadata;
        currentSlice = sanitizeSlice(metadata.insets, selectedNodeInfo.width, selectedNodeInfo.height);
        applySliceToInputs(currentSlice);
        logNineSliceDebug(metadata, selectedNodeInfo.cleanName || selectedNodeInfo.name);
        updateStatusFromState();
        drawPreview();
      }

      function sendAutoMetadata(nodeId, metadata, type) {
        parent.postMessage(
          {
            pluginMessage: {
              type,
              nodeId,
              metadata
            }
          },
          "*"
        );
      }

      function loadPreviewImage(payload) {
        if (!payload || !payload.nodeId) return;
        clearPreviewImage();
        const bytes = bytesToUint8Array(payload.bytes);
        const blob = new Blob([bytes], { type: "image/png" });
        const url = URL.createObjectURL(blob);
        const image = new Image();
        previewObjectUrl = url;
        previewNodeId = payload.nodeId;
        image.onload = () => {
          if (previewNodeId !== payload.nodeId || previewObjectUrl !== url) return;
          previewImage = image;
          currentPreviewAssetHash = payload.assetHash || "";
          setPreviewStatus(`Preview ${image.naturalWidth} x ${image.naturalHeight}`, "ok");
          if (selectedNodeInfo && selectedNodeInfo.nodeId === payload.nodeId && selectedNodeInfo.isNine) {
            const detected = buildAutoMetadataFromImage(
              image,
              selectedNodeInfo.width,
              selectedNodeInfo.height,
              currentPreviewAssetHash,
              selectedNodeInfo.cleanName || selectedNodeInfo.name
            );
            if (!selectedNodeInfo.hasManualOverride) {
              sendAutoMetadata(payload.nodeId, detected, "cacheAutoNineSlice");
            }
            maybeApplyDetectedAutoMetadata(detected, false);
          }
          updateNineMeta();
          drawPreview();
        };
        image.onerror = () => {
          if (previewNodeId !== payload.nodeId || previewObjectUrl !== url) return;
          clearPreviewImage();
          setPreviewStatus("Preview image could not be decoded.", "error");
          drawPreview();
        };
        image.src = url;
      }

      function lineHitTest(x, y) {
        if (!selectedNodeInfo || !selectedNodeInfo.hasSelection || !selectedNodeInfo.isNine) return null;
        const r = computePreviewRect(selectedNodeInfo.width, selectedNodeInfo.height);
        const leftX = r.x + currentSlice.left * r.scaleX;
        const rightX = r.x + (selectedNodeInfo.width - currentSlice.right) * r.scaleX;
        const topY = r.y + currentSlice.top * r.scaleY;
        const bottomY = r.y + (selectedNodeInfo.height - currentSlice.bottom) * r.scaleY;
        const tolerance = 8;
        if (Math.abs(x - leftX) <= tolerance && y >= r.y && y <= r.y + r.height) return "left";
        if (Math.abs(x - rightX) <= tolerance && y >= r.y && y <= r.y + r.height) return "right";
        if (Math.abs(y - topY) <= tolerance && x >= r.x && x <= r.x + r.width) return "top";
        if (Math.abs(y - bottomY) <= tolerance && x >= r.x && x <= r.x + r.width) return "bottom";
        return null;
      }

      function updateSliceFromDrag(kind, x, y) {
        if (!selectedNodeInfo || !selectedNodeInfo.hasSelection || !selectedNodeInfo.isNine) return;
        const width = selectedNodeInfo.width;
        const height = selectedNodeInfo.height;
        const r = computePreviewRect(width, height);
        if (kind === "left") {
          const px = clamp(Math.round((x - r.x) / r.scaleX), 0, width - currentSlice.right - 1);
          currentSlice.left = snapMarginToEdge(px);
        } else if (kind === "right") {
          const pos = clamp(Math.round((x - r.x) / r.scaleX), currentSlice.left + 1, width);
          currentSlice.right = snapMarginToEdge(width - pos);
        } else if (kind === "top") {
          const py = clamp(Math.round((y - r.y) / r.scaleY), 0, height - currentSlice.bottom - 1);
          currentSlice.top = snapMarginToEdge(py);
        } else if (kind === "bottom") {
          const pos = clamp(Math.round((y - r.y) / r.scaleY), currentSlice.top + 1, height);
          currentSlice.bottom = snapMarginToEdge(height - pos);
        }
        sliceDirtySinceSelection = true;
        currentSlice = sanitizeSlice(currentSlice, width, height);
        applySliceToInputs(currentSlice);
        updateStatusFromState();
        drawPreview();
      }

      function setSliceFromInputs() {
        if (!selectedNodeInfo || !selectedNodeInfo.hasSelection || !selectedNodeInfo.isNine) return;
        sliceDirtySinceSelection = true;
        currentSlice = sanitizeSlice(readInputSlice(), selectedNodeInfo.width, selectedNodeInfo.height);
        applySliceToInputs(currentSlice);
        updateStatusFromState();
        drawPreview();
      }

      canvas.addEventListener("mousedown", (event) => {
        const rect = canvas.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * canvas.width;
        const y = ((event.clientY - rect.top) / rect.height) * canvas.height;
        const hit = lineHitTest(x, y);
        if (hit) {
          dragState = { kind: hit };
          updateSliceFromDrag(hit, x, y);
        }
      });

      window.addEventListener("mousemove", (event) => {
        if (!dragState) return;
        const rect = canvas.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * canvas.width;
        const y = ((event.clientY - rect.top) / rect.height) * canvas.height;
        updateSliceFromDrag(dragState.kind, x, y);
      });

      window.addEventListener("mouseup", () => {
        dragState = null;
      });

      [sliceLeft, sliceTop, sliceRight, sliceBottom].forEach((input) => {
        input.addEventListener("input", () => {
          setSliceFromInputs();
        });
      });

      function requestSelectionInfoSoon() {
        if (requestSelectionTimer) {
          clearTimeout(requestSelectionTimer);
        }
        requestSelectionTimer = setTimeout(() => {
          parent.postMessage({ pluginMessage: { type: "requestSelectionInfo" } }, "*");
        }, 160);
      }

      assetScaleInput.addEventListener("input", () => {
        requestSelectionInfoSoon();
      });

      exportButton.onclick = () => {
        status.textContent = "Exporting...";
        status.classList.remove("error");
        downloadZipButton.disabled = true;
        parent.postMessage(
          {
            pluginMessage: {
              type: "exportSelection",
              assetBasePath: document.getElementById("assetBasePath").value,
              assetScale: assetScaleInput.value
            }
          },
          "*"
        );
      };

      function sanitizeFileName(value) {
        const cleaned = String(value || "ui")
          .replace(/[<>:"/\\|?*\x00-\x1F]/g, "_")
          .trim();
        return cleaned.length ? cleaned : "ui";
      }

      function cloneJson(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function walkNodes(nodes, callback) {
        for (const node of nodes || []) {
          callback(node);
          if (Array.isArray(node.children)) {
            walkNodes(node.children, callback);
          }
        }
      }

      function appendExportWarning(doc, message) {
        console.warn(message);
        if (!doc.meta) doc.meta = {};
        if (!doc.meta.validation) doc.meta.validation = { warnings: [], errors: [] };
        if (!Array.isArray(doc.meta.validation.warnings)) doc.meta.validation.warnings = [];
        doc.meta.validation.warnings.push(message);
      }

      function hashBytes(bytes) {
        let hash = 0x811c9dc5;
        for (const byte of bytes) {
          hash ^= byte;
          hash = Math.imul(hash, 0x01000193);
        }
        return (hash >>> 0).toString(16).padStart(8, "0");
      }

      const GENERIC_ASSET_NAMES = new Set([
        "rectangle",
        "group",
        "frame",
        "vector",
        "instance",
        "layer",
        "image",
        "ellipse",
        "star",
        "polygon",
        "union",
        "booleanoperation",
        "boolean_operation"
      ]);

      function sanitizeAssetBaseName(value) {
        return String(value || "")
          .normalize("NFKD")
          .toLowerCase()
          .replace(/@[a-zA-Z]+(?:\([^)]*\))?/g, " ")
          .replace(/[<>:"/\\|?*\x00-\x1F]/g, "_")
          .replace(/[^a-z0-9_.-]+/g, "_")
          .replace(/_+/g, "_")
          .replace(/^[_.-]+|[_.-]+$/g, "");
      }

      function isGenericAssetBaseName(value) {
        const sanitized = sanitizeAssetBaseName(value);
        if (!sanitized) return true;
        if (/^asset[-_]?[a-f0-9]{6,}(?:[-_]\d+)?$/i.test(sanitized) || /^ui[-_]?asset$/i.test(sanitized)) {
          return true;
        }
        const compact = sanitized.replace(/[_.-]+/g, "");
        const withoutTrailingDigits = compact.replace(/\d+$/g, "");
        return GENERIC_ASSET_NAMES.has(compact) || GENERIC_ASSET_NAMES.has(withoutTrailingDigits);
      }

      function shortHash(value, length = 6) {
        return sanitizeAssetBaseName(value).replace(/[^a-z0-9]/g, "").slice(0, length) || "000000";
      }

      function fallbackAssetBaseName(hashOrId) {
        return `asset_${shortHash(hashOrId, 8)}`;
      }

      function assetBaseNameFromPath(path) {
        const clean = String(path || "").split(/[?#]/, 1)[0] || "";
        const slashIndex = Math.max(clean.lastIndexOf("/"), clean.lastIndexOf("\\"));
        const fileName = slashIndex >= 0 ? clean.slice(slashIndex + 1) : clean;
        const dotIndex = fileName.lastIndexOf(".");
        return sanitizeAssetBaseName(dotIndex > 0 ? fileName.slice(0, dotIndex) : fileName);
      }

      function scoreAssetNameCandidate(candidate) {
        const generic = isGenericAssetBaseName(candidate.name);
        const sourceScore =
          candidate.source === "explicit"
            ? 10000
            : candidate.source === "component"
              ? 8000
              : candidate.source === "context"
                ? 6000
                : candidate.source === "layer"
                  ? 5000
                  : 1000;
        return sourceScore + (generic ? 0 : 1000) + Math.max(0, 240 - candidate.name.length) - Math.max(0, candidate.order || 0);
      }

      function chooseBestAssetName(candidates, fallbackHash) {
        const resolved = candidates
          .map((candidate) => ({
            ...candidate,
            name: sanitizeAssetBaseName(candidate.name)
          }))
          .filter((candidate) => candidate.name)
          .map((candidate) => ({
            ...candidate,
            generic: isGenericAssetBaseName(candidate.name),
            score: scoreAssetNameCandidate(candidate)
          }))
          .sort((a, b) => {
            if (b.score !== a.score) return b.score - a.score;
            if (a.name.length !== b.name.length) return a.name.length - b.name.length;
            return (a.order || 0) - (b.order || 0);
          });

        if (resolved.length === 0) {
          return {
            name: fallbackAssetBaseName(fallbackHash),
            source: "fallback",
            generic: true,
            score: 0
          };
        }

        const best = resolved[0];
        if (!best.generic || best.source === "explicit") {
          return best;
        }
        return {
          ...best,
          name: `${best.name}_${shortHash(fallbackHash, 6)}`
        };
      }

      function joinZipPath(...parts) {
        return parts
          .map((part) => String(part || "").replace(/^\/+|\/+$/g, ""))
          .filter(Boolean)
          .join("/");
      }

      function uniqueSorted(values) {
        return Array.from(new Set(values)).sort((a, b) => a.localeCompare(b));
      }

      function makeUniqueRootFolders(documents) {
        const seen = new Map();
        return documents.map((doc, index) => {
          const base = sanitizeFileName(doc.name || `Export${index + 1}`);
          const count = seen.get(base) || 0;
          seen.set(base, count + 1);
          return count === 0 ? base : `${base}__${count + 1}`;
        });
      }

      function makeUniqueJsonNames(documents) {
        const seen = new Map();
        return documents.map((doc, index) => {
          const base = sanitizeFileName(doc.name || `Export${index + 1}`);
          const count = seen.get(base) || 0;
          seen.set(base, count + 1);
          if (count > 0) {
            appendExportWarning(doc, `Duplicate export root name "${base}" found; writing JSON as "${base}__${count + 1}.json".`);
          }
          return count === 0 ? base : `${base}__${count + 1}`;
        });
      }

      function collectAssetNameCandidates(asset, order) {
        const candidates = [];
        const push = (name, source, offset) => {
          const sanitized = sanitizeAssetBaseName(name);
          if (sanitized) candidates.push({ name: sanitized, source, order: order * 10 + offset });
        };
        push(asset.name, asset.nameSource || "layer", 0);
        push(assetBaseNameFromPath(asset.src), "layer", 1);
        return candidates;
      }

      function finalizeExportedAssetsForZip({ documents, assetBytesByDocument, assetBasePath, sharedMode = "reused-only" }) {
        const rootFolders = makeUniqueRootFolders(documents);
        const canonicalBySignature = new Map();
        let order = 0;

        documents.forEach((doc, documentIndex) => {
          const bytesByAssetId = assetBytesByDocument[documentIndex] || new Map();
          for (const asset of doc.assets || []) {
            const bytes = bytesByAssetId.get(asset.id);
            if (!bytes) continue;
            const hash = hashBytes(bytes);
            const signature = `png:${hash}:${bytes.length}`;
            let canonical = canonicalBySignature.get(signature);
            if (!canonical) {
              canonical = {
                signature,
                hash,
                id: `asset-${hash}-${bytes.length}`,
                bytes,
                refs: [],
                candidates: [],
                baseName: fallbackAssetBaseName(hash),
                fileName: "",
                src: "",
                shared: false,
                usedBy: [],
                manifestAsset: null
              };
              canonicalBySignature.set(signature, canonical);
            }
            canonical.refs.push({
              documentIndex,
              rootName: doc.name,
              rootFolder: rootFolders[documentIndex],
              previousAssetId: asset.id,
              asset,
              order
            });
            canonical.candidates.push(...collectAssetNameCandidates(asset, order));
            order += 1;
          }
        });

        const canonicalAssets = Array.from(canonicalBySignature.values()).sort((a, b) => a.refs[0].order - b.refs[0].order);
        for (const canonical of canonicalAssets) {
          canonical.baseName = chooseBestAssetName(canonical.candidates, canonical.hash).name;
        }

        const byBaseName = new Map();
        for (const canonical of canonicalAssets) {
          const group = byBaseName.get(canonical.baseName) || [];
          group.push(canonical);
          byBaseName.set(canonical.baseName, group);
        }

        const usedPaths = new Set();
        for (const group of byBaseName.values()) {
          group.sort((a, b) => {
            const aBest = chooseBestAssetName(a.candidates, a.hash);
            const bBest = chooseBestAssetName(b.candidates, b.hash);
            if (bBest.score !== aBest.score) return bBest.score - aBest.score;
            return a.hash.localeCompare(b.hash);
          });

          if (group.length > 1) {
            const fileNames = group.map((canonical, index) =>
              index === 0 ? `${canonical.baseName}.png` : `${canonical.baseName}__${shortHash(canonical.hash, 6)}.png`
            );
            const warning = `Duplicate asset name "${group[0].baseName}" produced multiple different PNGs: ${fileNames.join(", ")}`;
            for (const canonical of group) {
              for (const documentIndex of new Set(canonical.refs.map((ref) => ref.documentIndex))) {
                appendExportWarning(documents[documentIndex], warning);
              }
            }
          }

          group.forEach((canonical, index) => {
            const rootFolderNames = uniqueSorted(canonical.refs.map((ref) => ref.rootFolder));
            canonical.usedBy = uniqueSorted(canonical.refs.map((ref) => ref.rootName));
            canonical.shared =
              sharedMode === "all-shared"
                ? true
                : sharedMode === "none"
                  ? false
                  : rootFolderNames.length > 1;
            const folder = canonical.shared ? "shared" : rootFolderNames[0];
            const suffix = index === 0 ? "" : `__${shortHash(canonical.hash, 6)}`;
            let fileName = `${canonical.baseName}${suffix}.png`;
            let src = joinZipPath(assetBasePath, folder, fileName);
            let conflictIndex = 2;
            while (usedPaths.has(src)) {
              fileName = `${canonical.baseName}${suffix}__${conflictIndex}.png`;
              src = joinZipPath(assetBasePath, folder, fileName);
              conflictIndex += 1;
            }
            usedPaths.add(src);
            canonical.fileName = fileName;
            canonical.src = src;

            const sourceAsset = canonical.refs[0].asset;
            const aliases = uniqueSorted(
              canonical.candidates
                .map((candidate) => sanitizeAssetBaseName(candidate.name))
                .filter((name) => name && name !== canonical.baseName && !isGenericAssetBaseName(name))
            );
            canonical.manifestAsset = {
              ...sourceAsset,
              id: canonical.id,
              name: canonical.baseName,
              src,
              width: sourceAsset.width,
              height: sourceAsset.height,
              scale: sourceAsset.scale,
              mimeType: sourceAsset.mimeType || "image/png",
              shared: canonical.shared,
              usedBy: canonical.usedBy
            };
            if (aliases.length) {
              canonical.manifestAsset.aliases = aliases;
              const warning = `Identical PNG bytes were referenced by multiple names: "${aliases.join(
                '", "'
              )}"; using "${canonical.fileName}"`;
              for (const documentIndex of new Set(canonical.refs.map((ref) => ref.documentIndex))) {
                appendExportWarning(documents[documentIndex], warning);
              }
            }
          });
        }

        documents.forEach((doc, documentIndex) => {
          const canonicalForDoc = canonicalAssets.filter((canonical) =>
            canonical.refs.some((ref) => ref.documentIndex === documentIndex)
          );
          const nextAssetByPreviousId = new Map();
          for (const canonical of canonicalForDoc) {
            for (const ref of canonical.refs) {
              if (ref.documentIndex === documentIndex) {
                nextAssetByPreviousId.set(ref.previousAssetId, canonical.manifestAsset);
              }
            }
          }
          doc.assets = canonicalForDoc.map((canonical) => canonical.manifestAsset);
          walkNodes(doc.children, (node) => {
            if (!node.assetId) return;
            const nextAsset = nextAssetByPreviousId.get(node.assetId);
            if (!nextAsset) return;
            node.assetId = nextAsset.id;
            if ("asset" in node) {
              node.asset = nextAsset.src;
            }
          });
          if (!doc.meta) doc.meta = {};
          doc.meta.assetStats = {
            totalReferencedAssets: (assetBytesByDocument[documentIndex] && assetBytesByDocument[documentIndex].size) || 0,
            uniqueAssets: canonicalForDoc.length,
            sharedAssets: canonicalForDoc.filter((canonical) => canonical.shared).length,
            localAssets: canonicalForDoc.filter((canonical) => !canonical.shared).length
          };
        });

        return {
          files: canonicalAssets.map((canonical) => ({
            assetId: canonical.id,
            src: canonical.src,
            fileName: canonical.fileName,
            bytes: canonical.bytes
          })),
          manifest: {
            version: 1,
            assetBasePath,
            assets: canonicalAssets.map((canonical) => canonical.manifestAsset)
          }
        };
      }

      function drawRegion(ctx2d, image, sx, sy, sw, sh, dx, dy, dw, dh) {
        if (sw <= 0 || sh <= 0 || dw <= 0 || dh <= 0) {
          return;
        }
        ctx2d.drawImage(image, sx, sy, sw, sh, dx, dy, dw, dh);
      }

      async function decodePng(bytes) {
        const blob = new Blob([bytes], { type: "image/png" });
        if ("createImageBitmap" in window) {
          return createImageBitmap(blob);
        }
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(blob);
          const image = new Image();
          image.onload = () => {
            URL.revokeObjectURL(url);
            resolve(image);
          };
          image.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error("PNG decode failed."));
          };
          image.src = url;
        });
      }

      function canvasToPngBytes(sourceCanvas) {
        return new Promise((resolve, reject) => {
          sourceCanvas.toBlob(async (blob) => {
            if (!blob) {
              reject(new Error("Canvas PNG encoding failed."));
              return;
            }
            resolve(new Uint8Array(await blob.arrayBuffer()));
          }, "image/png");
        });
      }

      function validateNineSliceForCompaction(node, asset, sourceWidth, sourceHeight, samplePixels) {
        const slice = node && node.slice;
        if (!slice) return "Missing slice data.";
        const values = [slice.left, slice.top, slice.right, slice.bottom];
        if (!values.every((n) => Number.isFinite(n))) return "Slice values must be finite numbers.";
        if (values.some((n) => n < 0)) return "Slice values must be >= 0.";
        if (slice.left + slice.right >= node.width) return "left + right must be less than node width.";
        if (slice.top + slice.bottom >= node.height) return "top + bottom must be less than node height.";
        const assetScale = Number.isFinite(asset.scale) && asset.scale > 0 ? asset.scale : 1;
        const leftPx = Math.round(slice.left * assetScale);
        const topPx = Math.round(slice.top * assetScale);
        const rightPx = Math.round(slice.right * assetScale);
        const bottomPx = Math.round(slice.bottom * assetScale);
        if ([leftPx, topPx, rightPx, bottomPx].some((n) => n < 0)) return "Scaled fixed regions must be >= 0 px.";
        if (leftPx + rightPx >= sourceWidth) return "left + right is too large for the source PNG width.";
        if (topPx + bottomPx >= sourceHeight) return "top + bottom is too large for the source PNG height.";
        if (!Number.isFinite(samplePixels) || samplePixels < 1) return "Stretch sample pixels must be at least 1.";
        return null;
      }

      async function compactNineSlicePng({ bytes, node, asset, samplePixels }) {
        const image = await decodePng(bytes);
        const sourceWidth = image.width;
        const sourceHeight = image.height;
        const validationError = validateNineSliceForCompaction(node, asset, sourceWidth, sourceHeight, samplePixels);
        if (validationError) {
          throw new Error(validationError);
        }

        const assetScale = Number.isFinite(asset.scale) && asset.scale > 0 ? asset.scale : 1;
        const leftPx = Math.round(node.slice.left * assetScale);
        const topPx = Math.round(node.slice.top * assetScale);
        const rightPx = Math.round(node.slice.right * assetScale);
        const bottomPx = Math.round(node.slice.bottom * assetScale);
        const isHorizontalOnly = topPx === 0 && bottomPx === 0;
        const compactCenterWidthPx = Math.max(1, Math.round(samplePixels));
        const compactCenterHeightPx = isHorizontalOnly ? sourceHeight : Math.max(1, Math.round(samplePixels));

        const outputWidth = leftPx + compactCenterWidthPx + rightPx;
        const outputHeight = isHorizontalOnly ? sourceHeight : topPx + compactCenterHeightPx + bottomPx;
        if (outputWidth <= 0 || outputHeight <= 0) {
          throw new Error(`Compacted size would be invalid (${outputWidth} x ${outputHeight}).`);
        }

        const x1 = leftPx;
        const x2 = sourceWidth - rightPx;
        const y1 = topPx;
        const y2 = sourceHeight - bottomPx;
        const dx1 = leftPx;
        const dx2 = leftPx + compactCenterWidthPx;
        const dy1 = topPx;
        const dy2 = topPx + compactCenterHeightPx;

        const out = document.createElement("canvas");
        out.width = outputWidth;
        out.height = outputHeight;
        const outCtx = out.getContext("2d");
        outCtx.imageSmoothingEnabled = true;
        outCtx.clearRect(0, 0, outputWidth, outputHeight);

        if (isHorizontalOnly) {
          drawRegion(outCtx, image, 0, 0, leftPx, sourceHeight, 0, 0, leftPx, sourceHeight);
          drawRegion(outCtx, image, x1, 0, x2 - x1, sourceHeight, dx1, 0, compactCenterWidthPx, sourceHeight);
          drawRegion(outCtx, image, x2, 0, rightPx, sourceHeight, dx2, 0, rightPx, sourceHeight);
        } else {
          drawRegion(outCtx, image, 0, 0, leftPx, topPx, 0, 0, leftPx, topPx);
          drawRegion(outCtx, image, x1, 0, x2 - x1, topPx, dx1, 0, compactCenterWidthPx, topPx);
          drawRegion(outCtx, image, x2, 0, rightPx, topPx, dx2, 0, rightPx, topPx);

          drawRegion(outCtx, image, 0, y1, leftPx, y2 - y1, 0, dy1, leftPx, compactCenterHeightPx);
          drawRegion(outCtx, image, x1, y1, x2 - x1, y2 - y1, dx1, dy1, compactCenterWidthPx, compactCenterHeightPx);
          drawRegion(outCtx, image, x2, y1, rightPx, y2 - y1, dx2, dy1, rightPx, compactCenterHeightPx);

          drawRegion(outCtx, image, 0, y2, leftPx, bottomPx, 0, dy2, leftPx, bottomPx);
          drawRegion(outCtx, image, x1, y2, x2 - x1, bottomPx, dx1, dy2, compactCenterWidthPx, bottomPx);
          drawRegion(outCtx, image, x2, y2, rightPx, bottomPx, dx2, dy2, rightPx, bottomPx);
        }

        const compactBytes = await canvasToPngBytes(out);
        const originalPixels = sourceWidth * sourceHeight;
        const compactPixels = outputWidth * outputHeight;
        const savings = originalPixels > 0 ? Math.round((1 - compactPixels / originalPixels) * 100) : 0;

        return {
          bytes: compactBytes,
          sourceWidth,
          sourceHeight,
          textureWidth: outputWidth,
          textureHeight: outputHeight,
          textureSlice: {
            left: leftPx,
            top: topPx,
            right: rightPx,
            bottom: bottomPx
          },
          compactCenterWidth: compactCenterWidthPx,
          compactCenterHeight: compactCenterHeightPx,
          assetScale,
          savings
        };
      }

      async function optimizeNineSliceAssetsForZip(doc, bytesByAssetId) {
        if (!optimizeNinepatchAssets.checked) {
          return bytesByAssetId;
        }

        const samplePixels = Math.max(1, Math.round(Number(stretchSamplePixels.value) || 1));
        stretchSamplePixels.value = String(samplePixels);
        const nodesByAssetId = new Map();
        walkNodes(doc.children, (node) => {
          if (node.type === "nineSlice" && node.assetId) {
            nodesByAssetId.set(node.assetId, node);
          }
        });

        const optimizedBytesByAssetId = new Map(bytesByAssetId);
        for (const asset of doc.assets || []) {
          const node = nodesByAssetId.get(asset.id);
          if (!node) continue;
          const bytes = bytesByAssetId.get(asset.id);
          if (!bytes) continue;
          try {
            const optimized = await compactNineSlicePng({ bytes, node, asset, samplePixels });
            optimizedBytesByAssetId.set(asset.id, optimized.bytes);
            asset.width = optimized.textureWidth;
            asset.height = optimized.textureHeight;
            node.textureSlice = optimized.textureSlice;
            node.assetOptimization = {
              type: "nineSliceCompact",
              enabled: true,
              sourceWidth: optimized.sourceWidth,
              sourceHeight: optimized.sourceHeight,
              textureWidth: optimized.textureWidth,
              textureHeight: optimized.textureHeight,
              compactCenterWidth: optimized.compactCenterWidth,
              compactCenterHeight: optimized.compactCenterHeight,
              assetScale: optimized.assetScale
            };
            console.log(
              `[Ninepatch] Compacted "${node.name}" ${optimized.sourceWidth}x${optimized.sourceHeight} -> ${optimized.textureWidth}x${optimized.textureHeight} (${optimized.savings}% fewer pixels).`
            );
            if (samplePixels <= 1) {
              appendExportWarning(
                doc,
                `Ninepatch "${node.name}" was compacted with a 1 px stretch sample; increase Stretch sample pixels if the stretch area contains unique gradients, patterns, text, icons, or decorations.`
              );
            }
          } catch (error) {
            appendExportWarning(
              doc,
              `Ninepatch "${node.name}" failed to compact and fell back to full-size PNG: ${
                error && error.message ? error.message : String(error)
              }`
            );
          }
        }
        return optimizedBytesByAssetId;
      }

      async function downloadZipExport() {
        if (!lastExport || !Array.isArray(lastExport.documents) || !Array.isArray(lastExport.assets)) {
          status.textContent = "Run Export Selection first.";
          status.classList.add("error");
          return;
        }
        if (!window.JSZip) {
          status.textContent = "ZIP library failed to load. Check network and retry.";
          status.classList.add("error");
          return;
        }

        try {
          const zip = new window.JSZip();
          const docs = lastExport.documents.map((doc) => cloneJson(doc));
          const jsonNames = makeUniqueJsonNames(docs);
          const assetBasePath = document.getElementById("assetBasePath").value || "assets/ui";

          const sourceBytesByAssetId = new Map();
          for (const item of lastExport.assets) {
            const bytes = Array.isArray(item.bytes) ? Uint8Array.from(item.bytes) : new Uint8Array(item.bytes || []);
            sourceBytesByAssetId.set(item.assetId, bytes);
          }

          const assetBytesByDocument = [];
          for (const doc of docs) {
            const docBytesByAssetId = new Map();
            for (const asset of doc.assets || []) {
              const bytes = sourceBytesByAssetId.get(asset.id);
              if (bytes) {
                docBytesByAssetId.set(asset.id, bytes);
              }
            }
            assetBytesByDocument.push(await optimizeNineSliceAssetsForZip(doc, docBytesByAssetId));
          }

          const finalized = finalizeExportedAssetsForZip({
            documents: docs,
            assetBytesByDocument,
            assetBasePath,
            sharedMode: "reused-only"
          });

          docs.forEach((doc, index) => {
            zip.file(`generated-ui/${jsonNames[index]}.json`, JSON.stringify(doc, null, 2));
          });

          for (const file of finalized.files) {
            zip.file(file.src, file.bytes);
          }
          zip.file(joinZipPath(assetBasePath, "manifest.json"), JSON.stringify(finalized.manifest, null, 2));

          const blob = await zip.generateAsync({ type: "blob" });
          const fileStem = docs.length === 1 ? jsonNames[0] : `${jsonNames[0]}-bundle`;
          const fileName = `${fileStem}-ui-export.zip`;
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);

          status.textContent = `ZIP downloaded: ${fileName}`;
          status.classList.remove("error");
          output.value =
            docs.length === 1
              ? JSON.stringify(docs[0], null, 2)
              : JSON.stringify({ documents: docs, manifest: finalized.manifest }, null, 2);
          lastExport.optimizedDocuments = docs;
          lastExport.manifest = finalized.manifest;
        } catch (error) {
          status.textContent = `ZIP export failed: ${error && error.message ? error.message : String(error)}`;
          status.classList.add("error");
        }
      }

      downloadZipButton.onclick = () => {
        void downloadZipExport();
      };

      function recalculateAutoSlice() {
        if (!selectedNodeInfo || !selectedNodeInfo.hasSelection || !selectedNodeInfo.isNine) {
          setNineStatus("Select one @nine layer first.", "error");
          return false;
        }
        if (!previewImage || previewNodeId !== selectedNodeInfo.nodeId) {
          setNineStatus("Preview is still loading. Try again in a moment.", "error");
          return false;
        }
        const detected = buildAutoMetadataFromImage(
          previewImage,
          selectedNodeInfo.width,
          selectedNodeInfo.height,
          currentPreviewAssetHash,
          selectedNodeInfo.cleanName || selectedNodeInfo.name
        );
        sliceDirtySinceSelection = false;
        maybeApplyDetectedAutoMetadata(detected, true);
        sendAutoMetadata(selectedNodeInfo.nodeId, detected, "applyAutoNineSlice");
        const warning = firstMetadataWarning(detected);
        setNineStatus(
          warning ||
            (detected.source === "auto" ? "Auto-detected slice recalculated." : "Switched to safe default slice."),
          detected.source === "auto" && !warning ? "ok" : ""
        );
        return true;
      }

      autoSuggestButton.onclick = () => {
        recalculateAutoSlice();
      };

      saveNinepatchButton.onclick = () => {
        const error = validateSlice(currentSlice);
        if (error) {
          setNineStatus(error, "error");
          return;
        }
        setNineStatus("Saving...", "");
        parent.postMessage(
          {
            pluginMessage: {
              type: "saveNineSlice",
              left: currentSlice.left,
              top: currentSlice.top,
              right: currentSlice.right,
              bottom: currentSlice.bottom,
              assetHash: currentPreviewAssetHash,
              confidence: resolvedMetadata && typeof resolvedMetadata.confidence === "number" ? resolvedMetadata.confidence : 1
            }
          },
          "*"
        );
      };

      clearNinepatchButton.onclick = () => {
        recalculateAutoSlice();
      };

      onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        if (message.type === "prepare-auto-nine-slice") {
          const items = Array.isArray(message.payload && message.payload.items) ? message.payload.items : [];
          Promise.all(
            items.map(async (item) => {
              try {
                const image = await decodePng(bytesToUint8Array(item.bytes));
                return {
                  nodeId: item.nodeId,
                  metadata: buildAutoMetadataFromImage(image, item.width, item.height, item.assetHash, item.name)
                };
              } catch {
                return {
                  nodeId: item.nodeId,
                  metadata: {
                    source: "default",
                    approved: false,
                    confidence: 0.15,
                    insets: createSafeDefaultSlice(item.width, item.height),
                    assetHash: item.assetHash,
                    algorithmVersion: AUTO_NINE_SLICE_ALGORITHM_VERSION,
                    mode: "fallback",
                    warnings: ["PNG decode failed during nine-slice auto-detection; using safe default slices."],
                    generatedAt: Date.now()
                  }
                };
              }
            })
          ).then((results) => {
            parent.postMessage(
              {
                pluginMessage: {
                  type: "prepare-auto-nine-slice-result",
                  requestId: message.payload && message.payload.requestId,
                  results
                }
              },
              "*"
            );
          });
          return;
        }

        if (message.type === "selection-info") {
          selectedNodeInfo = message.payload;
          if (!selectedNodeInfo.hasSelection) {
            selectionInfo.textContent = message.payload.message;
            ninePanel.style.display = "none";
            resolvedMetadata = null;
            lastDetectedAutoMetadata = null;
            sliceDirtySinceSelection = false;
            clearPreviewImage();
            setPreviewStatus("", "");
            drawPreview();
            return;
          }
          selectionInfo.textContent = "Selected: " + (selectedNodeInfo.cleanName || selectedNodeInfo.name);
          if (!selectedNodeInfo.isNine) {
            ninePanel.style.display = "none";
            resolvedMetadata = null;
            lastDetectedAutoMetadata = null;
            sliceDirtySinceSelection = false;
            clearPreviewImage();
            setPreviewStatus("", "");
            drawPreview();
            return;
          }
          if (selectedNodeInfo.renderBoundsError) {
            selectionInfo.textContent = selectedNodeInfo.message;
            ninePanel.style.display = "none";
            resolvedMetadata = null;
            lastDetectedAutoMetadata = null;
            sliceDirtySinceSelection = false;
            clearPreviewImage();
            setPreviewStatus(selectedNodeInfo.message, "error");
            drawPreview();
            return;
          }
          ninePanel.style.display = "block";
          if (previewNodeId !== selectedNodeInfo.nodeId) {
            clearPreviewImage();
            setPreviewStatus("Loading preview...", "");
          }
          nineMeta.textContent =
            "Layer: " +
            (selectedNodeInfo.cleanName || selectedNodeInfo.name) +
            " (" +
            Math.round(selectedNodeInfo.width) +
            " x " +
            Math.round(selectedNodeInfo.height) +
            ")";

          sliceDirtySinceSelection = false;
          resolvedMetadata = selectedNodeInfo.resolvedMetadata || {
            source: "default",
            approved: false,
            insets: createSafeDefaultSlice(selectedNodeInfo.width, selectedNodeInfo.height)
          };
          lastDetectedAutoMetadata =
            resolvedMetadata && resolvedMetadata.source !== "manual"
              ? resolvedMetadata
              : lastDetectedAutoMetadata && lastDetectedAutoMetadata.assetHash === currentPreviewAssetHash
                ? lastDetectedAutoMetadata
                : null;
          currentSlice = sanitizeSlice(selectedNodeInfo.slice, selectedNodeInfo.width, selectedNodeInfo.height);
          applySliceToInputs(currentSlice);
          drawPreview();
          updateStatusFromState();
          return;
        }

        if (message.type === "nine-slice-preview") {
          loadPreviewImage(message.payload);
          return;
        }

        if (message.type === "nine-slice-preview-cleared") {
          clearPreviewImage();
          setPreviewStatus("", "");
          drawPreview();
          return;
        }

        if (message.type === "nine-slice-preview-error") {
          clearPreviewImage();
          setPreviewStatus(message.payload && message.payload.message ? message.payload.message : "Preview export failed.", "error");
          drawPreview();
          return;
        }

        if (message.type === "nine-slice-saved") {
          sliceDirtySinceSelection = false;
          setNineStatus("Manual override saved.", "ok");
          parent.postMessage({ pluginMessage: { type: "requestSelectionInfo" } }, "*");
          return;
        }

        if (message.type === "nine-slice-auto-applied") {
          sliceDirtySinceSelection = false;
          setNineStatus(message.message || "Auto-detected slice applied.", "ok");
          parent.postMessage({ pluginMessage: { type: "requestSelectionInfo" } }, "*");
          return;
        }

        if (message.type === "nine-slice-error") {
          setNineStatus(message.message, "error");
          return;
        }

        if (message.type === "export-complete") {
          const documents = Array.isArray(message.documents) ? message.documents : [message.document].filter(Boolean);
          const rootCount = documents.length;
          status.textContent =
            rootCount > 1
              ? `Exported ${rootCount} roots and ${message.assets.length} unique asset(s).`
              : "Exported " + message.assets.length + " asset(s).";
          status.classList.remove("error");
          output.value =
            rootCount > 1
              ? JSON.stringify({ documents, manifest: message.manifest }, null, 2)
              : JSON.stringify(message.document, null, 2);
          lastExport = {
            document: message.document,
            documents,
            bundle: Boolean(message.bundle),
            manifest: message.manifest,
            assets: message.assets
          };
          downloadZipButton.disabled = false;
          return;
        }

        if (message.type === "export-error") {
          status.textContent = message.message;
          status.classList.add("error");
          downloadZipButton.disabled = true;
        }
      };

      parent.postMessage({ pluginMessage: { type: "requestSelectionInfo" } }, "*");
    </script>
  </body>
</html>
