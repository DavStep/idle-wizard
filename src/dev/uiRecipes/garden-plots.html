<!doctype html>
<html
  lang="en"
  data-style-theme="night"
  data-style-font="lilita-one"
  data-style-icons="icons"
>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Wizard Garden plots recipe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #17191f;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Garden plots visual recipe"></canvas>
    <output
      id="garden-plots-recipe-state"
      hidden
      data-empty-plots="5"
    ></output>

    <script type="module">
      import '@fontsource/lilita-one/400.css';
      import { PixiAssetManager } from '/src/rendering/pixi/assets/PixiAssetManager.js';
      import { PixiTransientEffectsLayer } from '/src/rendering/pixi/global/transient/PixiTransientEffectsLayer.js';
      import { PixiInputRouter } from '/src/rendering/pixi/input/PixiInputRouter.js';
      import { GardenPixiPage } from '/src/rendering/pixi/pages/garden/GardenPixiPage.js';
      import { PixiApplicationManager } from '/src/rendering/pixi/runtime/PixiApplicationManager.js';
      import { createPixiThemeSnapshot } from '/src/rendering/pixi/theme/PixiThemeTokens.js';

      const canvas = document.querySelector('canvas');
      const applicationManager = new PixiApplicationManager({ canvas });
      const assetManager = new PixiAssetManager();

      await Promise.all([
        applicationManager.initialize(),
        assetManager.loadAll(),
      ]);

      const inputRouter = new PixiInputRouter();
      inputRouter.mount({
        root: applicationManager.app.stage,
        canvas,
      });
      const transientEffects = new PixiTransientEffectsLayer({
        assets: assetManager,
        application: applicationManager.app,
        parent: applicationManager.layers.transient,
      });
      transientEffects.activate();

      const params = new URLSearchParams(window.location.search);
      const overflow = params.get('overflow') === '1';
      const growing = params.get('growing') === '1';
      const bulkActions = params.get('bulk') || 'all';
      const progressBar = params.get('progress') || 'regular';
      const emptyPlotCount = growing ? 4 : overflow ? 11 : 5;
      const plots = Array.from(
        { length: emptyPlotCount },
        (_, index) => index + 1,
      ).map((tileNumber) =>
        growing
          ? {
              id: `plot-${tileNumber}`,
              tileNumber,
              level: tileNumber <= 2 ? 2 : 1,
              phase: 'growing',
              herbKey: 'sage',
              actionText: 'growing',
              process: {
                durationMs: 10_000,
                endTimeMs: 6_000 + tileNumber * 500,
              },
              semanticId: `garden.plot.${tileNumber}`,
            }
          : {
              id: `plot-${tileNumber}`,
              tileNumber,
              level: tileNumber === 1 ? 2 : 1,
              phase: 'empty',
              hasSelectedSeed: true,
              canPlantSelectedSeed: false,
              toolbarSeedItemTypeId: 1,
              actionText: '',
              semanticId: `garden.plot.${tileNumber}`,
            },
      );
      plots.push({
        id: `plot-${emptyPlotCount + 1}`,
        tileNumber: emptyPlotCount + 1,
        phase: 'empty',
        buySlot: true,
        disabled: false,
        ...(growing
          ? {
              affordable: false,
              costCoin: 400,
              actionText: 'Unlock',
            }
          : {
              lockReason: 'research_locked',
              actionText: 'Research',
            }),
        semanticId: `garden.plot.${emptyPlotCount + 1}`,
      });
      Object.assign(
        document.querySelector('#garden-plots-recipe-state').dataset,
        {
          emptyPlots: growing ? '0' : String(emptyPlotCount),
          growingPlots: growing ? String(emptyPlotCount) : '0',
          progressBar,
          bulkActions,
        },
      );

      const page = new GardenPixiPage({
        assetManager,
        inputRouter,
        theme: createPixiThemeSnapshot({ progressBar }),
        timeSource: () => 0,
      });
      page.layout(applicationManager.projection);
      page.bind({
        garden: {
          now: 0,
          plots,
          actionBar: {
            canPlantAll:
              bulkActions === 'plant' || bulkActions === 'all',
            canHarvestAll: bulkActions === 'all',
            selectedSeed: {
              id: 'nettle-seed',
              itemTypeId: 3,
              key: 'nettleSeed',
              label: 'nettle',
              quantity: 75,
              icon: {
                kind: 'seed',
                key: 'nettleSeed',
              },
            },
            readyHarvestCount: 0,
            hasSeedChoices: true,
          },
        },
        actions: {
          activatePlot: (plot) => {
            if (plot.lockReason === 'research_locked') {
              document.querySelector('#garden-plots-recipe-state').dataset.feedback =
                'research locked';
              return {
                ok: false,
                reason: 'research_locked',
                tileNumber: plot.tileNumber,
                tooltip:
                  'You need to research first to unlock buying this slot.',
              };
            }
            transientEffects.emitReward({
              message: 'no seed',
              flyoutKey: `garden-no-seed-${plot.tileNumber}`,
            });
            document.querySelector('#garden-plots-recipe-state').dataset.feedback =
              'no seed';
            return {
              ok: false,
              reason: 'not_enough_seed',
              tileNumber: plot.tileNumber,
            };
          },
          plantAll: () => {
            document.querySelector('#garden-plots-recipe-state').dataset.feedback =
              'plant all';
            return { ok: true };
          },
          harvestAll: () => {
            transientEffects.emitReward({ message: 'Nothing to harvest' });
            document.querySelector('#garden-plots-recipe-state').dataset.feedback =
              'nothing to harvest';
            return { ok: false, reason: 'no_ready_tiles' };
          },
          openSeedPicker: () => {
            document.querySelector('#garden-plots-recipe-state').dataset.feedback =
              'open seeds';
            return { ok: true };
          },
        },
      });
      page.activate();
      applicationManager.layers.pageUi.addChild(page.root);
      window.__gardenPlotsRecipe = page;
    </script>
  </body>
</html>
