<!doctype html>
<html
  lang="en"
  data-style-theme="night"
  data-style-font="lilita-one"
  data-style-icons="icons"
>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Wizard Trade Alliance recipe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1c1e26;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Trade Alliance visual recipe"></canvas>

    <script type="module">
      import '@fontsource/lilita-one/400.css';
      import { PixiAssetManager } from '/src/rendering/pixi/assets/PixiAssetManager.js';
      import { createDialogViewModel } from '/src/rendering/pixi/acceptance/RetainedAcceptanceFixtures.js';
      import { PixiInputRouter } from '/src/rendering/pixi/input/PixiInputRouter.js';
      import { WorkshopDialogPixi } from '/src/rendering/pixi/pages/workshop/WorkshopDialogPixi.js';
      import { SemanticTargetRegistry } from '/src/rendering/pixi/retained/SemanticTargetRegistry.js';
      import { PixiApplicationManager } from '/src/rendering/pixi/runtime/PixiApplicationManager.js';

      const canvas = document.querySelector('canvas');
      const applicationManager = new PixiApplicationManager({ canvas });
      const assetManager = new PixiAssetManager();
      const inputRouter = new PixiInputRouter();

      await Promise.all([
        applicationManager.initialize(),
        assetManager.loadAll(),
      ]);
      inputRouter.mount({
        root: applicationManager.getApplication().stage,
        canvas,
      });

      const semanticTargets = new SemanticTargetRegistry();
      const dialog = new WorkshopDialogPixi({
        dialogId: 'workshop.alliance',
        assetManager,
        inputRouter,
        onClose: () => false,
        parent: applicationManager.layers.dialogsSource,
        semanticTargets,
      });
      const homeModel = createDialogViewModel('workshop.alliance', 'a');
      let selectedTabId = 'home';

      const questRows = [
        {
          id: 'quest-mana-tonic',
          title: 'Fill 500 mana tonic',
          itemKind: 'potion',
          itemKey: 'manaTonic',
          contributionLabel: 'Your Fill 0/25',
          progressLabel: '138/500',
          rewardAmountLabel: '5',
          rewardResource: 'crystal',
          actionLabel: 'Locked',
          actionVariant: 'gray',
          actionWidth: 58,
          actionHeight: 28,
          enabled: false,
          onActivate: null,
        },
        {
          id: 'quest-market',
          title: 'Supply The Market',
          contributionLabel: 'Your Route 12/12',
          progressLabel: '50/50',
          rewardAmountLabel: '5',
          rewardResource: 'crystal',
          actionLabel: 'Claim',
          actionVariant: 'yellow',
          actionWidth: 58,
          actionHeight: 28,
          enabled: true,
          onActivate: () => true,
        },
      ];
      const settings = {
        allianceId: 'night-owls',
        name: 'Night Owls',
        tag: 'OWL',
        tagColor: 'violet',
        description: 'Patient traders building a stronger market together.',
        notice: 'Weekly goal: support every active member.',
        joinMode: 'apply',
        editable: true,
        canDisband: false,
        onSave: async () => ({ ok: true }),
      };

      function bindDialog() {
        const tabs = homeModel.tabs.map((tab) => ({
          ...tab,
          selected: tab.id === selectedTabId,
          onSelect: () => {
            selectedTabId = tab.id;
            bindDialog();
            return true;
          },
        }));
        dialog.bind({
          ...homeModel,
          selectedTabId,
          tabs,
          ownedAllianceHome: selectedTabId === 'home',
          rowWidget: selectedTabId === 'quests' ? 'allianceQuest' : null,
          rows: selectedTabId === 'quests' ? questRows : homeModel.members,
          settings: selectedTabId === 'settings' ? settings : null,
        });
        dialog.layout(applicationManager.projection);
      }

      bindDialog();
      dialog.activate();

      window.__allianceRecipe = {
        applicationManager,
        dialog,
        semanticTargets,
      };
    </script>
  </body>
</html>
