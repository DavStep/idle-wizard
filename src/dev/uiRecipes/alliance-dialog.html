<!doctype html>
<html
  lang="en"
  data-style-theme="night"
  data-style-font="lilita-one"
  data-style-icons="icons"
>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Wizard Trade Alliance recipe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1c1e26;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Trade Alliance visual recipe"></canvas>

    <script type="module">
      import '@fontsource/lilita-one/400.css';
      import { PixiAssetManager } from '/src/rendering/pixi/assets/PixiAssetManager.js';
      import { createDialogViewModel } from '/src/rendering/pixi/acceptance/RetainedAcceptanceFixtures.js';
      import {
        GLOBAL_DIALOG_IDS,
        registerGlobalDialogFactories,
      } from '/src/rendering/pixi/global/dialogs/index.js';
      import { PixiInputRouter } from '/src/rendering/pixi/input/PixiInputRouter.js';
      import { WorkshopDialogPixi } from '/src/rendering/pixi/pages/workshop/WorkshopDialogPixi.js';
      import { PixiViewModelFactory } from '/src/rendering/pixi/presenters/PixiViewModelFactory.js';
      import { SemanticTargetRegistry } from '/src/rendering/pixi/retained/SemanticTargetRegistry.js';
      import { PixiApplicationManager } from '/src/rendering/pixi/runtime/PixiApplicationManager.js';
      import { PixiUiRuntimeFacade } from '/src/rendering/pixi/runtime/PixiUiRuntimeFacade.js';

      const canvas = document.querySelector('canvas');
      const applicationManager = new PixiApplicationManager({ canvas });
      const assetManager = new PixiAssetManager();
      const inputRouter = new PixiInputRouter();
      const runtime = new PixiUiRuntimeFacade({
        applicationManager,
        assetManager,
        inputRouter,
      });

      registerGlobalDialogFactories(runtime);
      await runtime.initialize();

      const semanticTargets = new SemanticTargetRegistry();
      const dialog = new WorkshopDialogPixi({
        dialogId: 'workshop.alliance',
        assetManager,
        inputRouter,
        onClose: () => false,
        parent: applicationManager.layers.dialogsSource,
        semanticTargets,
      });
      const recipeParams = new URLSearchParams(window.location.search);
      const recipeMode = recipeParams.get('mode');
      const recipeTab = recipeParams.get('tab');
      const directoryMode = recipeMode === 'directory';
      const settingsAccessible = recipeMode !== 'member';
      const homeModel = createDialogViewModel('workshop.alliance', 'a');
      const viewModelFactory = new PixiViewModelFactory();
      let selectedTabId = directoryMode
        ? recipeTab === 'create'
          ? 'create'
          : 'browse'
        : recipeTab === 'quests' ||
            (recipeTab === 'settings' && settingsAccessible)
          ? recipeTab
          : 'home';
      const actionEvents = [];
      function recordAction(event) {
        actionEvents.push(event);
        canvas.dataset.lastAction = JSON.stringify(event);
      }
      const directorySnapshot = {
        connected: true,
        ownAlliance: null,
        ownMember: null,
        ownApplications: [],
        alliances: [
          {
            allianceId: 'night-owls',
            name: 'Night Owls',
            tag: 'OWL',
            tagColor: 'violet',
            joinMode: 'open',
            leaderIdentity: 'mira',
            memberCount: 18,
            totalIncome: 1_240_000,
          },
          {
            allianceId: 'sun-circle',
            name: 'Sun Circle',
            tag: 'SUN',
            tagColor: 'amber',
            joinMode: 'apply',
            leaderIdentity: 'sol',
            memberCount: 11,
            totalIncome: 815_000,
          },
          {
            allianceId: 'root-keepers',
            name: 'Root Keepers',
            tag: 'ROOT',
            tagColor: 'green',
            joinMode: 'closed',
            leaderIdentity: 'rowan',
            memberCount: 7,
            totalIncome: 348_000,
          },
        ],
        members: [
          {
            allianceId: 'night-owls',
            memberIdentity: 'mira',
            username: 'Mira',
            character: 'mira',
            frame: 'violet',
            playerLevel: 24,
            role: 'tradeMaster',
          },
          {
            allianceId: 'night-owls',
            memberIdentity: 'juniper',
            username: 'Juniper',
            character: 'juniper',
            frame: 'emerald',
            playerLevel: 18,
            role: 'trader',
          },
          {
            allianceId: 'sun-circle',
            memberIdentity: 'sol',
            username: 'Sol',
            character: 'elara',
            frame: 'sun',
            playerLevel: 21,
            role: 'tradeMaster',
          },
          {
            allianceId: 'root-keepers',
            memberIdentity: 'rowan',
            username: 'Rowan',
            character: 'rowan',
            frame: 'emerald',
            playerLevel: 19,
            role: 'tradeMaster',
          },
        ],
      };

      const questRows = [
        {
          id: 'quest-mana-tonic',
          title: 'Fill 500 mana tonic',
          itemKind: 'potion',
          itemKey: 'manaTonic',
          contributionLabel: 'Your Fill 0/25',
          progressLabel: '138/500',
          rewardAmountLabel: '5',
          rewardResource: 'crystal',
          actionLabel: 'Locked',
          actionVariant: 'gray',
          actionWidth: 58,
          actionHeight: 28,
          enabled: false,
          onActivate: null,
        },
        {
          id: 'quest-market',
          title: 'Supply The Market',
          itemKind: 'resource',
          itemKey: 'coin',
          contributionLabel: 'Your Route 12/12',
          progressLabel: '50/50',
          rewardAmountLabel: '5',
          rewardResource: 'crystal',
          actionLabel: 'Claim',
          actionVariant: 'yellow',
          actionWidth: 58,
          actionHeight: 28,
          enabled: true,
          onActivate: () => true,
        },
      ];
      const settings = {
        allianceId: 'night-owls',
        name: 'Night Owls',
        tag: 'OWL',
        tagColor: 'violet',
        description: 'Patient traders building a stronger market together.',
        notice: 'Weekly goal: support every active member.',
        joinMode: 'apply',
        editable: true,
        canDisband: false,
        onSave: async () => ({ ok: true }),
      };

      function bindDialog() {
        if (directoryMode) {
          dialog.bind(
            viewModelFactory.createAllianceDialog(
              directorySnapshot,
              null,
              {
                openAlliance: (alliance) => {
                  recordAction({
                    type: 'open',
                    allianceId: alliance.allianceId,
                  });
                  runtime.openDialog(GLOBAL_DIALOG_IDS.ALLIANCE, {
                    alliance,
                  });
                  return true;
                },
                joinAlliance: (allianceId) => {
                  recordAction({ type: 'join', allianceId });
                  return true;
                },
                applyAlliance: (allianceId) => {
                  recordAction({ type: 'apply', allianceId });
                  directorySnapshot.ownApplications = [
                    {
                      applicationKey: `application-${allianceId}`,
                      allianceId,
                    },
                  ];
                  bindDialog();
                  return true;
                },
                cancelAllianceApplication: (applicationKey) => {
                  recordAction({ type: 'cancel', applicationKey });
                  directorySnapshot.ownApplications = [];
                  bindDialog();
                  return true;
                },
                selectAllianceTab: (tabId) => {
                  selectedTabId = tabId;
                  bindDialog();
                  return true;
                },
                createAlliance: async () => ({ ok: true }),
                openPlayer: (player) => {
                  dialog.deactivate();
                  runtime.openDialog(GLOBAL_DIALOG_IDS.PLAYER, {
                    ownPlayer: false,
                    player,
                  });
                  return true;
                },
              },
              selectedTabId,
            ),
          );
          dialog.layout(applicationManager.projection);
          return;
        }

        const tabs = homeModel.tabs
          .filter((tab) => settingsAccessible || tab.id !== 'settings')
          .map((tab) => ({
            ...tab,
            selected: tab.id === selectedTabId,
            onSelect: () => {
              selectedTabId = tab.id;
              bindDialog();
              return true;
            },
          }));
        dialog.bind({
          ...homeModel,
          copy: selectedTabId === 'quests' ? '' : homeModel.copy,
          selectedTabId,
          tabs,
          ownedAllianceHome: selectedTabId === 'home',
          rowWidget: selectedTabId === 'quests' ? 'allianceQuest' : null,
          rows: selectedTabId === 'quests' ? questRows : homeModel.members,
          settings: selectedTabId === 'settings' ? settings : null,
        });
        dialog.layout(applicationManager.projection);
      }

      bindDialog();
      dialog.activate();

      window.__allianceRecipe = {
        applicationManager,
        actionEvents,
        dialog,
        directorySnapshot,
        runtime,
        semanticTargets,
      };
    </script>
  </body>
</html>
