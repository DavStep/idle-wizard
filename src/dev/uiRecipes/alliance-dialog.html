<!doctype html>
<html
  lang="en"
  data-style-theme="night"
  data-style-font="lilita-one"
  data-style-icons="icons"
>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Wizard Alliance Workspace recipe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1c1e26;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Alliance Workspace visual recipe"></canvas>

    <script type="module">
      import '@fontsource/lilita-one/400.css';
      import { PixiAssetManager } from '/src/rendering/pixi/assets/PixiAssetManager.js';
      import { createDialogViewModel } from '/src/rendering/pixi/acceptance/RetainedAcceptanceFixtures.js';
      import {
        GLOBAL_DIALOG_IDS,
        registerGlobalDialogFactories,
      } from '/src/rendering/pixi/global/dialogs/index.js';
      import { PixiInputRouter } from '/src/rendering/pixi/input/PixiInputRouter.js';
      import { PixiBottomPanelView } from '/src/rendering/pixi/global/chrome/PixiBottomPanelView.js';
      import { PixiWorldChatView } from '/src/rendering/pixi/global/chrome/PixiWorldChatView.js';
      import { AlliancePixiPage } from '/src/rendering/pixi/pages/alliance/AlliancePixiPage.js';
      import { WorkshopDialogPixi } from '/src/rendering/pixi/pages/workshop/WorkshopDialogPixi.js';
      import { PixiViewModelFactory } from '/src/rendering/pixi/presenters/PixiViewModelFactory.js';
      import { SemanticTargetRegistry } from '/src/rendering/pixi/retained/SemanticTargetRegistry.js';
      import { PixiApplicationManager } from '/src/rendering/pixi/runtime/PixiApplicationManager.js';
      import { PixiUiRuntimeFacade } from '/src/rendering/pixi/runtime/PixiUiRuntimeFacade.js';
      import { TextEntryService } from '/src/rendering/textEntry/TextEntryService.js';

      const canvas = document.querySelector('canvas');
      const applicationManager = new PixiApplicationManager({ canvas });
      const assetManager = new PixiAssetManager();
      const inputRouter = new PixiInputRouter();
      const textEntryService = new TextEntryService({ canvas });
      const runtime = new PixiUiRuntimeFacade({
        applicationManager,
        assetManager,
        inputRouter,
        textEntryService,
      });

      registerGlobalDialogFactories(runtime);
      runtime.registerDialog(
        'workshop.worldChat',
        ({ assets, counters, inputRouter, layers, semanticRegistry, textEntryService }) =>
          new WorkshopDialogPixi({
            dialogId: 'workshop.worldChat',
            parent: layers.dialogs,
            assetManager: assets,
            semanticTargets: semanticRegistry,
            inputRouter,
            textEntryService,
            counters,
            onClose: () => runtime.closeDialog('workshop.worldChat'),
          }),
      );
      await runtime.initialize();

      const semanticTargets = new SemanticTargetRegistry();
      const dialog = new AlliancePixiPage({
        assetManager,
        inputRouter,
        semanticRegistry: semanticTargets,
        textEntryService,
      });
      applicationManager.getLayers().pageUi.addChild(dialog.root);
      const chatPreview = new PixiWorldChatView({
        assets: assetManager,
        inputRouter,
      });
      applicationManager.getLayers().globalChrome.addChild(chatPreview.root);
      const bottomPanel = new PixiBottomPanelView({
        assets: assetManager,
        inputRouter,
        semanticRegistry: semanticTargets,
      });
      applicationManager.getLayers().globalChrome.addChild(bottomPanel.root);
      const recipeParams = new URLSearchParams(window.location.search);
      const recipeMode = recipeParams.get('mode');
      const recipeTab = recipeParams.get('tab');
      const directoryMode = recipeMode === 'directory';
      const settingsAccessible = recipeMode !== 'member';
      const homeModel = createDialogViewModel('workshop.alliance', 'a');
      const viewModelFactory = new PixiViewModelFactory();
      let selectedTabId = directoryMode
        ? recipeTab === 'create'
          ? 'create'
          : 'browse'
        : recipeTab === 'quests' ||
            ((recipeTab === 'requests' || recipeTab === 'settings') &&
              settingsAccessible)
          ? recipeTab
          : 'home';
      const actionEvents = [];
      function recordAction(event) {
        actionEvents.push(event);
        canvas.dataset.lastAction = JSON.stringify(event);
      }
      const directorySnapshot = {
        connected: true,
        ownAlliance: null,
        ownMember: null,
        ownApplications: [],
        alliances: [
          {
            allianceId: 'night-owls',
            name: 'Night Owls',
            tag: 'OWL',
            tagColor: 'violet',
            bannerColor: 'violet',
            emblemColor: 'white',
            emblemId: 'owl',
            joinMode: 'open',
            leaderIdentity: 'mira',
            memberCount: 18,
            totalIncome: 1_240_000,
          },
          {
            allianceId: 'sun-circle',
            name: 'Sun Circle',
            tag: 'SUN',
            tagColor: 'amber',
            bannerColor: 'red',
            emblemColor: 'gold',
            emblemId: 'sunburst',
            joinMode: 'apply',
            leaderIdentity: 'sol',
            memberCount: 11,
            totalIncome: 815_000,
          },
          {
            allianceId: 'root-keepers',
            name: 'Root Keepers',
            tag: 'ROOT',
            tagColor: 'green',
            bannerColor: 'green',
            emblemColor: 'silver',
            emblemId: 'oak-leaf',
            joinMode: 'closed',
            leaderIdentity: 'rowan',
            memberCount: 7,
            totalIncome: 348_000,
          },
        ],
        members: [
          {
            allianceId: 'night-owls',
            memberIdentity: 'mira',
            username: 'Mira',
            character: 'mira',
            frame: 'violet',
            playerLevel: 24,
            role: 'tradeMaster',
          },
          {
            allianceId: 'night-owls',
            memberIdentity: 'juniper',
            username: 'Juniper',
            character: 'juniper',
            frame: 'emerald',
            playerLevel: 18,
            role: 'trader',
          },
          {
            allianceId: 'sun-circle',
            memberIdentity: 'sol',
            username: 'Sol',
            character: 'elara',
            frame: 'sun',
            playerLevel: 21,
            role: 'tradeMaster',
          },
          {
            allianceId: 'root-keepers',
            memberIdentity: 'rowan',
            username: 'Rowan',
            character: 'rowan',
            frame: 'emerald',
            playerLevel: 19,
            role: 'tradeMaster',
          },
        ],
      };

      window.__allianceQuestLastAction = null;
      const questRows = [
        {
          id: 'quest-mana-tonic',
          title: 'Fill 500 mana tonic',
          itemKind: 'potion',
          itemKey: 'manaTonic',
          contributionLabel: 'Your contribution 0/25',
          progressLabel: '138/500',
          progress: 138 / 500,
          rewardAmountLabel: '5',
          rewardResource: 'crystal',
          actionLabel: 'Locked',
          actionVariant: 'gray',
          actionWidth: 72,
          actionHeight: 42,
          enabled: false,
          onActivate: null,
        },
        {
          id: 'quest-market',
          title: 'Supply The Market',
          itemKind: 'resource',
          itemKey: 'coin',
          contributionLabel: 'Your contribution 12/12',
          progressLabel: '50/50',
          progress: 1,
          rewardAmountLabel: '5',
          rewardResource: 'crystal',
          actionLabel: 'Claim',
          actionVariant: 'green',
          actionWidth: 72,
          actionHeight: 42,
          enabled: true,
          onActivate: () => {
            window.__allianceQuestLastAction = 'claim-market';
            return true;
          },
        },
      ];
      const applicationRows = [
        {
          id: 'application-luna',
          identity: 'luna',
          username: 'Luna',
          character: 'mira',
          frame: 'violet',
          detail: 'Lv 14',
          prestigeCount: 3,
          preview: '175k Produced',
          onActivate: () => {
            recordAction({ type: 'open-player', identity: 'luna' });
            return true;
          },
        },
        {
          id: 'application-thorne',
          identity: 'thorne',
          username: 'Thorne',
          character: 'rowan',
          frame: 'classic',
          detail: 'Lv 9',
          prestigeCount: 1,
          preview: '68k Produced',
          onActivate: () => {
            recordAction({ type: 'open-player', identity: 'thorne' });
            return true;
          },
        },
      ];
      applicationRows.forEach((application) => {
        application.primaryAction = {
          label: 'Accept',
          variant: 'green',
          onActivate: () => {
            recordAction({ type: 'accept', applicationKey: application.id });
            applicationRows.splice(applicationRows.indexOf(application), 1);
            bindDialog();
            return true;
          },
        };
        application.secondaryAction = {
          label: 'Deny',
          variant: 'red',
          onActivate: () => {
            recordAction({ type: 'deny', applicationKey: application.id });
            applicationRows.splice(applicationRows.indexOf(application), 1);
            bindDialog();
            return true;
          },
        };
      });
      const settings = {
        allianceId: 'night-owls',
        name: 'Night Owls',
        tag: 'OWL',
        tagColor: 'violet',
        bannerColor: 'blue',
        emblemColor: 'gold',
        emblemId: 'owl',
        description: 'Patient traders building a stronger market together.',
        notice: 'Weekly goal: support every active member.',
        joinMode: 'apply',
        editable: true,
        canDisband: false,
        onSave: async (profile) => {
          Object.assign(settings, profile);
          recordAction({
            type: 'save-settings',
            bannerColor: profile.bannerColor,
            emblemColor: profile.emblemColor,
          });
          bindDialog();
          return { ok: true };
        },
      };
      const allianceChat = viewModelFactory.createWorldChatDialog(
        {
          connected: true,
          messages: [
            {
              body: 'Welcome to the alliance hall.',
              character: 'mira',
              frame: 'violet',
              id: 'alliance-chat-1',
              rankLabel: 'Quartermaster',
              sentAtMs: Date.now(),
              username: 'Luna',
            },
            {
              body: 'I can fill the herb quest this evening.',
              character: 'juniper',
              frame: 'emerald',
              id: 'alliance-chat-2',
              rankLabel: 'Trader',
              sentAtMs: Date.now(),
              username: 'Juniper',
            },
            {
              body: 'Mira was promoted to Broker by Luna.',
              character: 'rowan',
              frame: 'emerald',
              id: 'alliance-chat-system-1',
              sentAtMs: Date.now(),
              showSystemAvatar: true,
              username: 'system',
            },
          ],
        },
        {
          openPlayer: (player) => {
            recordAction({
              type: 'open-player',
              username: player.username,
            });
            return true;
          },
          sendWorldChat: async (body) => {
            recordAction({ type: 'alliance-chat', body });
            return { ok: true };
          },
        },
      );
      allianceChat.title = 'Alliance Chat';

      function bindBottom() {
        const visibleTabIds = directoryMode
          ? ['browse', 'create']
          : [
              'home',
              'quests',
              ...(settingsAccessible ? ['requests'] : []),
              'chat',
              ...(settingsAccessible ? ['settings'] : []),
            ];
        bottomPanel.bind({
          allianceHud: {
            notifications: {
              quests: questRows.some((row) => row.actionLabel === 'Claim'),
              requests: applicationRows.length > 0,
            },
            selectedTabId,
            tabs: [
              'browse',
              'create',
              'home',
              'quests',
              'requests',
              'chat',
              'settings',
            ].map((id) => ({
              id,
              unlocked: true,
              visible: visibleTabIds.includes(id),
            })),
          },
          currentPageId: 'alliance',
          hudMode: 'alliance',
          notifications: {
            workshop: applicationRows.length > 0,
          },
          pages: [{ id: 'workshop', unlocked: true, visible: true }],
          actions: {
            selectAllianceTab: (tabId) => {
              selectedTabId = tabId;
              bindDialog();
              return true;
            },
            showPage: (pageId) => {
              recordAction({ type: 'show-page', pageId });
              return true;
            },
          },
        });
        bottomPanel.layout(applicationManager.projection);
      }

      function bindDialog() {
        if (directoryMode) {
          dialog.bind(
            viewModelFactory.createAllianceWorkspace(
              directorySnapshot,
              selectedTabId,
              {
                openAlliance: (alliance) => {
                  recordAction({
                    type: 'open',
                    allianceId: alliance.allianceId,
                  });
                  runtime.openDialog(GLOBAL_DIALOG_IDS.ALLIANCE, {
                    alliance,
                  });
                  return true;
                },
                joinAlliance: (allianceId) => {
                  recordAction({ type: 'join', allianceId });
                  return true;
                },
                applyAlliance: (allianceId) => {
                  recordAction({ type: 'apply', allianceId });
                  directorySnapshot.ownApplications = [
                    {
                      applicationKey: `application-${allianceId}`,
                      allianceId,
                    },
                  ];
                  bindDialog();
                  return true;
                },
                cancelAllianceApplication: (applicationKey) => {
                  recordAction({ type: 'cancel', applicationKey });
                  directorySnapshot.ownApplications = [];
                  bindDialog();
                  return true;
                },
                selectAllianceTab: (tabId) => {
                  selectedTabId = tabId;
                  bindDialog();
                  return true;
                },
                createAlliance: async (profile) => {
                  recordAction({ type: 'create', ...profile });
                  return { ok: true };
                },
                openPlayer: (player) => {
                  dialog.deactivate();
                  runtime.openDialog(GLOBAL_DIALOG_IDS.PLAYER, {
                    ownPlayer: false,
                    player,
                  });
                  return true;
                },
              },
            ),
          );
          dialog.layout(applicationManager.projection);
          chatPreview.bind({ visible: false });
          chatPreview.layout(applicationManager.projection);
          bindBottom();
          return;
        }

        const tabs = homeModel.tabs
          .filter(
            (tab) =>
              settingsAccessible ||
              (tab.id !== 'requests' && tab.id !== 'settings'),
          )
          .map((tab) => ({
            ...tab,
            selected: tab.id === selectedTabId,
            onSelect: () => {
              selectedTabId = tab.id;
              bindDialog();
              return true;
            },
          }));
        dialog.bind({
          ...homeModel,
          chat: allianceChat,
          copy: selectedTabId === 'quests' ? '' : homeModel.copy,
          flag: {
            bannerColor: settings.bannerColor,
            emblemColor: settings.emblemColor,
            emblemId: settings.emblemId,
          },
          selectedTabId,
          tabs,
          ownedAllianceHome: selectedTabId === 'home',
          rowWidget:
            selectedTabId === 'quests'
              ? 'allianceQuest'
              : selectedTabId === 'requests'
                ? 'playerRelationship'
                : null,
          rows:
            selectedTabId === 'quests'
              ? questRows
              : selectedTabId === 'requests'
                ? applicationRows
                : homeModel.members,
          emptyLabel:
            selectedTabId === 'requests' && applicationRows.length === 0
              ? 'No Pending Requests'
              : '',
          requestsSettings:
            selectedTabId === 'requests' && settingsAccessible
              ? {
                  allianceId: settings.allianceId,
                  editable: true,
                  joinMode: settings.joinMode,
                  onSave: async (joinMode) => {
                    settings.joinMode = joinMode;
                    recordAction({ type: 'save-join-mode', joinMode });
                    bindDialog();
                    return { ok: true };
                  },
                }
              : null,
          settings:
            selectedTabId === 'settings'
              ? {
                  ...settings,
                  mode: 'settings',
                }
              : null,
        });
        dialog.layout(applicationManager.projection);
        chatPreview.bind({
          label: 'Alliance Chat',
          messages: allianceChat.rows,
          visible: !directoryMode,
          onActivate: () => {
            runtime.openDialog('workshop.worldChat', allianceChat);
            return true;
          },
        });
        chatPreview.layout(applicationManager.projection);
        bindBottom();
      }

      bindDialog();
      dialog.activate();
      chatPreview.activate();
      bottomPanel.activate();

      window.__allianceRecipe = {
        applicationManager,
        actionEvents,
        bottomPanel,
        chatPreview,
        dialog,
        directorySnapshot,
        runtime,
        semanticTargets,
      };
    </script>
  </body>
</html>
