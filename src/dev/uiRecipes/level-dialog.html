<!doctype html>
<html
  lang="en"
  data-style-theme="night"
  data-style-font="lilita-one"
  data-style-icons="icons"
>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Wizard level dialog recipe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1c1e26;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Level dialog visual recipe"></canvas>
    <output
      id="level-dialog-recipe-state"
      hidden
      data-selected-level="4"
      data-close-count="0"
    ></output>

    <script type="module">
      import '@fontsource/lilita-one/400.css';
      import { PixiInputRouter } from '/src/rendering/pixi/input/PixiInputRouter.js';
      import {
        GLOBAL_DIALOG_IDS,
        registerGlobalDialogFactories,
      } from '/src/rendering/pixi/global/dialogs/index.js';
      import { PixiApplicationManager } from '/src/rendering/pixi/runtime/PixiApplicationManager.js';
      import { PixiUiRuntimeFacade } from '/src/rendering/pixi/runtime/PixiUiRuntimeFacade.js';

      const resourceRow = (label, value, resource) => ({
        label,
        value,
        resource,
        icon: { frameName: `resource:${resource}` },
        iconPosition: 'after',
      });
      const totals = ({
        gardenPlots = 3,
        cauldrons = 1,
        traderStands = 1,
        playerStands = 1,
        manaCapacity,
        manaRegeneration,
      }) => [
        { label: 'Garden Plots', value: String(gardenPlots) },
        { label: 'Cauldrons', value: String(cauldrons) },
        { label: 'Trader Stands', value: String(traderStands) },
        { label: 'Player Stands', value: String(playerStands) },
        resourceRow('Mana Capacity', String(manaCapacity), 'mana'),
        resourceRow(
          'Mana Regeneration',
          `${manaRegeneration}/sec`,
          'mana',
        ),
      ];

      const canvas = document.querySelector('canvas');
      const recipeState = document.querySelector(
        '#level-dialog-recipe-state',
      );
      const inputRouter = new PixiInputRouter();
      const applicationManager = new PixiApplicationManager({ canvas });
      const runtime = new PixiUiRuntimeFacade({
        applicationManager,
        inputRouter,
      });

      registerGlobalDialogFactories(runtime);
      await runtime.initialize();
      const levelModel = {
        currentLevel: 4,
        maxLevel: 5,
        selectedLevel: 4,
        actions: {
          selectLevel(level) {
            recipeState.dataset.selectedLevel = String(level);
            return true;
          },
          close() {
            recipeState.dataset.closeCount = String(
              Number(recipeState.dataset.closeCount) + 1,
            );
            return true;
          },
        },
        levels: [
          {
            level: 3,
            current: false,
            unlocked: true,
            addedRows: [
              resourceRow('Mana Capacity', '+50', 'mana'),
              resourceRow('Bonus', '+1', 'crystal'),
            ],
            totalRows: totals({
              manaCapacity: 150,
              manaRegeneration: 3,
            }),
          },
          {
            level: 4,
            current: true,
            unlocked: true,
            addedRows: [
              resourceRow('Mana Capacity', '+50', 'mana'),
              resourceRow('Mana Regeneration', '+1/sec', 'mana'),
              resourceRow('Bonus', '+1', 'crystal'),
            ],
            totalRows: totals({
              manaCapacity: 200,
              manaRegeneration: 4,
            }),
          },
          {
            level: 5,
            current: false,
            unlocked: false,
            addedRows: [
              { label: 'Unlocks', value: 'Brewing' },
              resourceRow('Mana Capacity', '+50', 'mana'),
              resourceRow('Bonus', '+1', 'crystal'),
            ],
            totalRows: totals({
              cauldrons: 2,
              manaCapacity: 250,
              manaRegeneration: 5,
            }),
          },
        ],
      };
      const levelDialog = runtime.openDialog(
        GLOBAL_DIALOG_IDS.LEVEL,
        levelModel,
      );
      window.__levelDialogRecipe = levelDialog;
    </script>
  </body>
</html>
