<!doctype html>
<html
  lang="en"
  data-style-theme="night"
  data-style-font="lilita-one"
  data-style-icons="icons"
>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Wizard inbox dialog recipe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1c1e26;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Inbox dialog visual recipe"></canvas>

    <script type="module">
      import '@fontsource/lilita-one/400.css';
      import { PixiInputRouter } from '/src/rendering/pixi/input/PixiInputRouter.js';
      import {
        GLOBAL_DIALOG_IDS,
        registerGlobalDialogFactories,
      } from '/src/rendering/pixi/global/dialogs/index.js';
      import { PixiApplicationManager } from '/src/rendering/pixi/runtime/PixiApplicationManager.js';
      import { PixiUiRuntimeFacade } from '/src/rendering/pixi/runtime/PixiUiRuntimeFacade.js';

      const canvas = document.querySelector('canvas');
      const inputRouter = new PixiInputRouter();
      const applicationManager = new PixiApplicationManager({ canvas });
      const runtime = new PixiUiRuntimeFacade({
        applicationManager,
        inputRouter,
      });

      registerGlobalDialogFactories(runtime);
      await runtime.initialize();
      const showEmptyState = new URLSearchParams(window.location.search).has('empty');
      const inboxModel = {
        connected: true,
        mail: showEmptyState ? [] : [
          {
            mailKey: 'world-event:bandits-on-north-road',
            sourceType: 'worldEvent',
            senderLabel: 'world event',
            title: 'event finished',
            body: 'you placed #4 in Bandits on North Road with 1,162,530 points. here are your rewards.',
            createdAtMs: Date.UTC(2026, 7, 17, 12),
            read: false,
            hasReward: true,
            rewardCollected: false,
            rewardText: '3 crystal, 1 emerald',
          },
          {
            mailKey: 'world-event:tainted-well',
            senderLabel: 'World Event',
            title: 'Tainted Well',
            body: 'You placed #1 in Tainted Well with 621,948 points. Here are your rewards.',
            createdAtMs: Date.UTC(2026, 6, 28),
            read: true,
            hasReward: true,
            rewardCollected: true,
            rewardText: '4 emerald',
          },
        ],
      };
      let inboxDialog;
      inboxModel.actions = {
        claimReward: async () => {
          inboxModel.mail[0].rewardCollected = true;
          inboxModel.mail[0].read = true;
          inboxDialog.bind(inboxModel);
          return { ok: true };
        },
      };
      inboxDialog = runtime.openDialog(GLOBAL_DIALOG_IDS.INBOX, inboxModel);
    </script>
  </body>
</html>
