<!doctype html>
<html
  lang="en"
  data-style-theme="midnight"
  data-style-font="lilita-one"
  data-style-icons="icons"
>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Wizard bottom room tabs recipe</title>
    <link rel="stylesheet" href="/src/styles/base.css">
    <style>
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #23202c;
      }

      .recipe-viewport {
        position: relative;
        overflow: hidden;
      }

      .game-stage {
        --design-width: 390;
        --design-height: 844;
        --source-ui-scale: 1;
        --style-ui-scale: 1;
        --app-stage-width: 390px;
        --app-stage-height: 844px;
        --app-source-ui-screen-width: 390px;

        width: 390px;
        height: 844px;
        max-width: none;
        max-height: none;
        overflow: hidden;
        background: #23202c;
        transform-origin: top left;
      }

      .room-bottom-panel__tab {
        animation: none !important;
      }

      .room-bottom-panel-layer {
        transform: none;
      }
    </style>
  </head>
  <body>
    <div class="recipe-viewport">
      <main class="game-stage" aria-label="Bottom room tabs visual recipe"></main>
    </div>

    <script type="module">
      import '@fontsource/lilita-one/400.css';
      import {
        BOTTOM_PANEL_TABS,
        BottomPanelViewManager,
      } from '/src/pages/bottomPanel/managers/BottomPanelViewManager.js';

      const recipeViewport = document.querySelector('.recipe-viewport');
      const gameStage = document.querySelector('.game-stage');
      const fitRecipe = () => {
        const scale = Math.min(window.innerWidth / 390, window.innerHeight / 844);
        recipeViewport.style.width = `${390 * scale}px`;
        recipeViewport.style.height = `${844 * scale}px`;
        gameStage.style.transform = `scale(${scale})`;
      };
      fitRecipe();
      window.addEventListener('resize', fitRecipe);

      const searchParams = new URLSearchParams(location.search);
      const requestedTabCount = Number(searchParams.get('tabs') ?? 5);
      const requestedCurrentPageId =
        searchParams.get('current') ?? 'workshop';
      const requestedLockedPageId = searchParams.get('locked');
      const optionalStates = [
        { id: 'guild', unlocked: true, visible: true },
        { id: 'prestige', unlocked: true, visible: true },
      ].slice(0, Math.max(0, Math.min(2, requestedTabCount - 5)));
      const manager = new BottomPanelViewManager({
        getCurrentPageId: () => requestedCurrentPageId,
        onShowPage: (pageId) => manager.setCurrentPageId(pageId),
      });

      manager.mount(gameStage);
      manager.setPageStates([
        ...BOTTOM_PANEL_TABS.map(({ id }) => ({
          id,
          unlocked: id !== requestedLockedPageId,
          visible: true,
        })),
        ...optionalStates,
      ]);
    </script>
  </body>
</html>
