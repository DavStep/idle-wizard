<!doctype html>
<html
  lang="en"
  data-style-theme="night"
  data-style-font="lilita-one"
  data-style-icons="icons"
>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Wizard request progress recipe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #17191f;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Workshop request progress visual recipe"></canvas>
    <output
      id="request-progress-recipe-state"
      hidden
      data-current="1"
      data-required="3"
    ></output>

    <script type="module">
      import '@fontsource/lilita-one/400.css';
      import { PixiAssetManager } from '/src/rendering/pixi/assets/PixiAssetManager.js';
      import { WorkshopPixiPage } from '/src/rendering/pixi/pages/workshop/WorkshopPixiPage.js';
      import {
        QUEST_REQUEST_BOX_BOINK_DURATION_MS,
        QuestCompletionMotionCoordinator,
      } from '/src/rendering/pixi/managers/QuestCompletionMotionCoordinator.js';
      import { PixiViewModelFactory } from '/src/rendering/pixi/presenters/PixiViewModelFactory.js';
      import { PixiApplicationManager } from '/src/rendering/pixi/runtime/PixiApplicationManager.js';

      const canvas = document.querySelector('canvas');
      const recipeState = document.querySelector(
        '#request-progress-recipe-state',
      );
      const applicationManager = new PixiApplicationManager({ canvas });
      const assetManager = new PixiAssetManager();
      const searchParams = new URLSearchParams(location.search);
      const completionFrame = searchParams.get(
        'completionFrame',
      );
      const longLabel = searchParams.has('longLabel');
      const researching = searchParams.has('researching');
      let now = 0;
      let nextFrameId = 1;
      const pendingFrames = new Map();
      const questCompletionMotionCoordinator =
        new QuestCompletionMotionCoordinator();
      const viewModelFactory = new PixiViewModelFactory();

      function runFrame(timestamp) {
        now = timestamp;
        const callbacks = [...pendingFrames.values()];
        pendingFrames.clear();
        for (const callback of callbacks) {
          callback(timestamp);
        }
      }

      await Promise.all([
        applicationManager.initialize(),
        assetManager.loadAll(),
      ]);

      const model = viewModelFactory.createWorkshop({
        gameplay: {
          tasks: {
            currentLevel: researching ? 3 : 5,
            level: {
              tasks: [
                researching
                  ? {
                      taskId: 'level3-research-mint-seed',
                      type: 'research',
                      researchId: 'unlockSeed:mintSeed',
                      requirementLabel: 'Research Mint Seed',
                      itemKind: 'seed',
                      itemKey: 'mintSeed',
                      progressQuantity: 0,
                      requiredQuantity: 1,
                      progress: 0,
                      autoProgress: true,
                      isActiveQuest: true,
                    }
                  : {
                      taskId: 'level5-brew-mana-tonic',
                      requirementLabel: longLabel
                        ? 'Research Mana Tonic Brewing Speed I'
                        : 'Brew Mana Tonic',
                      itemKind: 'potion',
                      itemKey: 'manaTonic',
                      progressQuantity: 1,
                      requiredQuantity: 3,
                      progress: 0,
                      autoProgress: true,
                      isActiveQuest: true,
                    },
              ],
            },
          },
          ...(researching
            ? {
                research: {
                  inProgressResearches: [
                    {
                      researchId: 'unlockSeed:mintSeed',
                      totalSeconds: 120,
                      remainingSeconds: 65,
                    },
                  ],
                },
              }
            : {}),
        },
      });
      const page = new WorkshopPixiPage({
        assetManager,
        questCompletionMotionCoordinator,
        requestFrame: (callback) => {
          const frameId = nextFrameId++;
          pendingFrames.set(frameId, callback);
          return frameId;
        },
        cancelFrame: (frameId) => {
          pendingFrames.delete(frameId);
        },
        timeSource: () => now,
        reducedMotion: () => false,
      });
      page.layout(applicationManager.projection);
      page.bind(model);
      page.activate();
      applicationManager.layers.pageUi.addChild(page.root);

      const row = model.workshop.tasks.rows[0];
      recipeState.dataset.current = String(row.current);
      recipeState.dataset.required = String(row.required);
      recipeState.dataset.progress = String(row.progress);
      recipeState.dataset.longLabel = String(longLabel);
      recipeState.dataset.researching = String(researching);
      if (researching) {
        runFrame(5_000);
      }
      if (completionFrame) {
        const transitionId = questCompletionMotionCoordinator.begin({
          previousTaskId: row.id,
          nextTaskId: 'level11-summon-lavender-seed',
        });
        const nextModel = viewModelFactory.createWorkshop({
          gameplay: {
            tasks: {
              currentLevel: 11,
              level: {
                tasks: [
                  {
                    taskId: 'level11-summon-lavender-seed',
                    requirementLabel: 'Summon Lavender Seed',
                    itemKind: 'seed',
                    itemKey: 'lavenderSeed',
                    progressQuantity: 0,
                    requiredQuantity: 40,
                    progress: 0,
                    autoProgress: true,
                    isActiveQuest: true,
                  },
                ],
              },
            },
          },
        });
        page.bind(nextModel);
        runFrame(560);
        questCompletionMotionCoordinator.startFlight(transitionId);
        questCompletionMotionCoordinator.complete(transitionId);
        const completionProgress =
          completionFrame === 'peak'
            ? 0.45
            : completionFrame === 'undershoot'
              ? 0.74
              : 1;
        runFrame(560 + QUEST_REQUEST_BOX_BOINK_DURATION_MS * completionProgress);
        recipeState.dataset.completionFrame = completionFrame;
      }
    </script>
  </body>
</html>
