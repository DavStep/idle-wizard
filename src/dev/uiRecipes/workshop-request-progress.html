<!doctype html>
<html
  lang="en"
  data-style-theme="midnight"
  data-style-font="lilita-one"
  data-style-icons="icons"
>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Wizard request progress recipe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #17191f;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Workshop request progress visual recipe"></canvas>
    <output
      id="request-progress-recipe-state"
      hidden
      data-current="1"
      data-required="3"
    ></output>

    <script type="module">
      import '@fontsource/lilita-one/400.css';
      import { PixiAssetManager } from '/src/rendering/pixi/assets/PixiAssetManager.js';
      import { WorkshopPixiPage } from '/src/rendering/pixi/pages/workshop/WorkshopPixiPage.js';
      import { PixiViewModelFactory } from '/src/rendering/pixi/presenters/PixiViewModelFactory.js';
      import { PixiApplicationManager } from '/src/rendering/pixi/runtime/PixiApplicationManager.js';

      const canvas = document.querySelector('canvas');
      const recipeState = document.querySelector(
        '#request-progress-recipe-state',
      );
      const applicationManager = new PixiApplicationManager({ canvas });
      const assetManager = new PixiAssetManager();

      await Promise.all([
        applicationManager.initialize(),
        assetManager.loadAll(),
      ]);

      const model = new PixiViewModelFactory().createWorkshop({
        gameplay: {
          tasks: {
            currentLevel: 5,
            level: {
              tasks: [
                {
                  taskId: 'level5-brew-mana-tonic',
                  requirementLabel: 'Brew Mana Tonic',
                  itemKind: 'potion',
                  itemKey: 'manaTonic',
                  progressQuantity: 1,
                  requiredQuantity: 3,
                  progress: 0,
                  autoProgress: true,
                  isActiveQuest: true,
                },
              ],
            },
          },
        },
      });
      const page = new WorkshopPixiPage({ assetManager });
      page.layout(applicationManager.projection);
      page.bind(model);
      page.activate();
      applicationManager.layers.pageUi.addChild(page.root);

      const row = model.workshop.tasks.rows[0];
      recipeState.dataset.progress = String(row.progress);
    </script>
  </body>
</html>
