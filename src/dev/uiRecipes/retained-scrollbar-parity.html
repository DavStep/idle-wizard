<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Wizard retained scrollbar parity recipe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1c1e26;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Retained Root Run scrollbar parity recipe"></canvas>

    <script type="module">
      import '@fontsource/lilita-one/400.css';
      import { Container, Graphics } from 'pixi.js';
      import {
        RetainedScrollArea,
        createText,
      } from '/src/rendering/pixi/pages/workshop/RetainedPageKit.js';
      import {
        PixiApplicationManager,
      } from '/src/rendering/pixi/runtime/PixiApplicationManager.js';

      const canvas = document.querySelector('canvas');
      const applicationManager = new PixiApplicationManager({ canvas });
      await applicationManager.initialize();

      const surface = new Container({ label: 'scrollbar-parity-surface' });
      const backdrop = new Graphics({ label: 'scrollbar-parity-backdrop' });
      backdrop
        .roundRect(12, 64, 336, 368, 10)
        .fill({ color: 0x2a2017 })
        .stroke({ color: 0x090705, width: 2 });
      const paper = new Graphics({ label: 'scrollbar-parity-paper' });
      paper
        .roundRect(22, 72, 316, 352, 8)
        .fill({ color: 0xf5d9ad })
        .stroke({ color: 0x6a3b24, width: 2 });

      const scroll = new RetainedScrollArea({
        label: 'root-run-scrollbar-parity',
      });
      scroll.setBounds(30, 80, 292, 336);

      const rowHeight = 112;
      for (let index = 0; index < 12; index += 1) {
        const row = new Graphics({
          label: `scrollbar-parity-row-${index + 1}`,
        });
        row
          .roundRect(0, index * rowHeight, 286, 102, 8)
          .fill({ color: index % 2 === 0 ? 0xffe9c8 : 0xf8ddb6 })
          .stroke({ color: 0x7c4a30, width: 1.5 });
        const label = createText(`Upgrade ${index + 1}`, {
          fontSize: 14,
          lineHeight: 17,
          fontWeight: '700',
          fill: 0x65412f,
        });
        label.position.set(12, index * rowHeight + 12);
        scroll.content.addChild(row, label);
      }
      scroll.setContentHeight(rowHeight * 12 - 10);
      scroll.scrollTo(150);

      surface.addChild(backdrop, paper, scroll.root);
      applicationManager.layers.pageUi.addChild(surface);
      window.__scrollbarParityRecipe = {
        applicationManager,
        scroll,
        surface,
      };
    </script>
  </body>
</html>
