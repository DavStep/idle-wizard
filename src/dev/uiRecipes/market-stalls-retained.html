      }
      const playerShopSnapshot = {
        connected: true,
        proceedsCoin: 42,
        listings: [
          { listingKey: 'mira-sage', sellerIdentity: 'mira-id', username: 'Mira', itemKey: 'sageSeed', itemLabel: 'sage seed', itemKind: 'seed', quantity: 8, priceCoin: 12 },

          { listingKey: 'juniper-briar', sellerIdentity: 'juniper-id', username: 'Juniper', itemKey: 'briarSeed', itemLabel: 'briar seed', itemKind: 'seed', quantity: 3, priceCoin: 25 },

        requests: [

          { requestKey: 'rowan-sage', username: 'Rowan', itemKey: 'sageSeed', itemLabel: 'sage seed', itemKind: 'seed', quantity: 10, priceCoin: 9 },
        ],
        ownRequests: [],
        tradeHistory: [],
      };
      const playerInfoSnapshot = {
        players: [
          { identity: 'mira-id', username: 'Mira', allianceName: 'Night Owls', allianceTag: 'OWL', allianceTagColor: 'blue', character: 'elara', frame: 'gold' },
          { identity: 'rowan-id', username: 'Rowan', allianceName: 'Ash Wardens', allianceTag: 'ASH', allianceTagColor: 'orange', character: 'rowan', frame: 'classic' },
          { identity: 'juniper-id', username: 'Juniper', allianceName: 'Fern Circle', allianceTag: 'FERN', allianceTagColor: 'green', character: 'elara', frame: 'classic' },
          { identity: 'orin-id', username: 'Orin', allianceTag: '', allianceTagColor: 'ink', character: 'rowan', frame: 'classic' },
          { identity: 'elara-id', username: 'Elara', allianceName: 'Moon Guild', allianceTag: 'MOON', allianceTagColor: 'purple', character: 'elara', frame: 'gold' },
        ],
      };

      const canvas = document.querySelector('canvas');
      const query = new URLSearchParams(window.location.search);
      const dialogQuery = query.get('dialog');
      const selectedTabId = ['traders', 'players', 'crystals'].includes(
        query.get('tab'),
      )
        ? query.get('tab')
        : ['request', 'listing', 'market', 'buy'].includes(dialogQuery)
          ? 'players'
          : 'traders';
      if (query.get('proceeds') === 'none') {
        playerShopSnapshot.proceedsCoin = 0;
      }
      if (query.get('requests') === 'empty') {
        gameplaySnapshot.shop.playerRequests.slots = [
          { slotNumber: 1, unlocked: true },
        ];
      }
      if (query.get('coinOffer') === 'ready') {
        gameplaySnapshot.shop.coinOffer.canCollect = true;
        gameplaySnapshot.shop.coinOffer.cooldownRemainingSeconds = 0;
      }
      if (query.get('dailyCrystalOffer') === 'cooldown') {
        gameplaySnapshot.shop.dailyCrystalOffer.canCollect = false;
        gameplaySnapshot.shop.dailyCrystalOffer.cooldownRemainingSeconds = 86_340;
      }
      const showStallDialog = dialogQuery === 'stall';
      const showLedgerDialog = dialogQuery === 'ledger';
      const showRequestDialog = dialogQuery === 'request';
      const showListingDialog = dialogQuery === 'listing';
      const showMarketDialog = dialogQuery === 'market';
      const showBuyDialog = dialogQuery === 'buy';
      const showListingReference =
        query.get('listingState') === 'reference';
      const requestStatus = query.get('requestStatus') ?? '';
      const showOverflowItems = query.get('items') === 'overflow';
      const loopSaleShine = query.get('saleShine') === 'loop';
      const loopSaleFlyout = query.get('saleFlyout') === 'loop';
      const showCrystalClaimFlyout = query.get('claimFlyout') === 'crystal';
      if (query.get('categories') === 'seed') {
        for (const catalogue of [
          gameplaySnapshot.shop.shelf,
          gameplaySnapshot.shop.playerShelf,
          gameplaySnapshot.shop.stock,
        ]) {
          catalogue.sellKinds = catalogue.sellKinds.filter(
            (kind) => kind.kind === 'seed',
          );
        }
      }
      if (showListingReference) {
        gameplaySnapshot.research.completedResearchIds = [
          'unlockSeed:sageSeed',
          'unlockSeed:mintSeed',
        ];
        gameplaySnapshot.shop.playerShelf.sellItems = [
          {
            itemTypeId: 2,
            key: 'mintSeed',
            label: 'mint seed',
            kind: 'seed',
            quantity: 12,
          },
        ];
        gameplaySnapshot.shop.playerShelf.slots[0] = {
          slotNumber: 1,
          unlocked: true,
        };
      }
      const stallCount = Math.max(
        0,
        Math.floor(Number(query.get('count')) || 0),
      );
      const showNotifiedEmptyStall =
        query.get('stalls') === 'empty-notified';
      const showUnlockStall = query.get('stalls') === 'unlock';
      if (query.get('stalls') === 'full') {
        const slotTemplates = gameplaySnapshot.shop.shelf.slots;
        gameplaySnapshot.shop.shelf.slots = Array.from(
          { length: 5 },
          (_, index) => ({
            ...slotTemplates[index % slotTemplates.length],
            slotNumber: index + 1,
          }),
        );
      }
      if (query.get('stalls') === 'single') {
        gameplaySnapshot.shop.shelf.slots =
          gameplaySnapshot.shop.shelf.slots.slice(0, 1);
      }
      if (showNotifiedEmptyStall) {
        gameplaySnapshot.shop.shelf.sellItems[0].quantity = 5;
        gameplaySnapshot.shop.shelf.slots = [
          {
            slotNumber: 1,
            unlocked: true,
            batchSize: 1,
          },
        ];
      }
      if (showUnlockStall) {
        gameplaySnapshot.coin.current = 80;
        gameplaySnapshot.shop.market = {
          name: 'Small Town Market',
          rank: 1,
        };
        gameplaySnapshot.shop.shelf = {
          ...gameplaySnapshot.shop.shelf,
          unlockedSlots: 0,
          maxSlots: 1,
          maxUnlockedSlotsByLevel: 1,
          slotCosts: [50, 150, 400, 1000, 2500],
          nextSlotNumber: 1,
          nextSlotCost: 50,
          nextSlotLockedByLevel: false,
          nextSlotRequiresLevel: null,
          selectedSlotNumber: null,
          slots: [{ slotNumber: 1, unlocked: false }],

      }
      if (showStallDialog) {
        if (showOverflowItems) {
          const overflowSeeds =
            gameplaySnapshot.shop.stock.items
              .filter((item) => item.kind === 'seed')
              .slice(0, 8);
          gameplaySnapshot.shop.shelf.sellItems =
            overflowSeeds.map((item, index) => ({
              ...item,
              quantity: 119 + index * 73,
              sellCoin: Math.max(1, item.buyCoin - 2),
              sellNeed: item.npcNeed,
            }));
          gameplaySnapshot.research.completedResearchIds =
            overflowSeeds.map((item) => `unlockSeed:${item.key}`);

        gameplaySnapshot.shop.shelf.slots[0].loadedQuantity = 10;

          gameplaySnapshot.shop.shelf.sellItems[0].quantity = stallCount;
          gameplaySnapshot.shop.shelf.slots[0].loadedQuantity = 0;
        }

      const assetManager = new PixiAssetManager();
      const inputRouter = new PixiInputRouter();
      const semanticTargets = new SemanticTargetRegistry();
      const textEntryService = new TextEntryService({ canvas });

      await Promise.all([
        applicationManager.initialize(),
        assetManager.loadAll(),
      ]);

        root: applicationManager.getApplication().stage,
        canvas,
      });

        assets: assetManager,
        application: applicationManager.getApplication(),
        parent: applicationManager.layers.transient,
        semanticRegistry: semanticTargets,
      });
      transientEffects.activate();
      window.__marketRecipeEffects = transientEffects;

      const topPanel = showCrystalClaimFlyout
        || loopSaleFlyout
        ? new PixiTopPanelView({
            assets: assetManager,
            inputRouter,
            semanticRegistry: semanticTargets,
          })
        : null;

        topPanel?.bind({
          username: 'Wizard',
          mana: { current: 295, cap: 1_000, perSecond: 10 },
          coin: gameplaySnapshot.coin.current,
          contextCurrency: {
            resource: 'crystal',
            amount: gameplaySnapshot.crystal.current,
            visible: true,
          },
          level: 20,
          quest: { visible: false },
          reveal: {},
        });
      };

        bindTopPanel();
        topPanel.activate();
        applicationManager.layers.globalChrome.addChild(topPanel.root);

        assetManager,
        dialogLayer: applicationManager.layers.dialogsSource,
        dialogRegistry,
        inputRouter,
        semanticRegistry: semanticTargets,
        textEntryService,
      });

        (projection) => {
          page.layout(projection);
          dialogRegistry.layout(projection);
          transientEffects.layout(projection);
        },
        { emitCurrent: true },
      );

      let stallItemKind = 'seed';
      let stallTargetQuantity = query.has('count')

        : 32;
      let requestItemKind = 'seed';
      let listingItemKind = 'seed';
      let marketBrowseTab = 'selling';
      let marketFilterDraft = { item: '', minPrice: '', username: '' };
      let marketFilterApplied = { item: '', minPrice: '', username: '' };
      let marketBuyListingKey = showBuyDialog ? 'mira-sage' : null;
      let marketBuyQuantity = showBuyDialog ? 3 : 1;
      let marketBuyStatus = '';
      let requestDraft = {
        itemTypeId: 1,
        itemKey: 'sageSeed',
        itemLabel: 'sage seed',
        itemKind: 'seed',
        quantity: 30,
        priceCoin: 7,
      };
      let listingDraft = {
        itemTypeId: showListingReference ? 2 : 1,
        itemKey: showListingReference ? 'mintSeed' : 'sageSeed',
        itemLabel: showListingReference ? 'mint seed' : 'sage seed',
        itemKind: 'seed',
        quantity: showListingReference ? 12 : 5,
        priceCoin: showListingReference ? 10 : 9,
      };
      const rebindDialog = (dialogId) => {
        const nextViewModel = createViewModel();
        page.bind(nextViewModel);
        const dialog =
          dialogId === SHOP_DIALOG_IDS.REQUEST
            ? nextViewModel.shop.players.requests.slots[0].dialog
            : dialogId === SHOP_DIALOG_IDS.MARKET
              ? nextViewModel.shop.dialogs.market
              : dialogId === SHOP_DIALOG_IDS.BUY
                ? nextViewModel.shop.dialogs.buy
              : nextViewModel.shop.players.market.slots[0].dialog;
        page.openDialog(dialogId, dialog);
      };

        createShop({
          gameplaySnapshot,
          playerInfoSnapshot,
          playerShopSnapshot,
          notificationSnapshot: showNotifiedEmptyStall
            ? {
                active: true,
                tone: 'orange',
                children: {
                  npcListing: 'orange',
                },
              }
            : null,
          selectedTabId,
          uiState: {
            ledgerKind,
            marketBrowseTab,
            marketFilterDraft,
            marketFilterApplied,
            marketBuyListingKey,
            marketBuyQuantity,
            marketBuyStatus,
            ...(showStallDialog
              ? {
                  stallTargetQuantityBySlot: {
                    1: stallTargetQuantity,
                  },
                  stallItemKindBySlot: { 1: stallItemKind },
                }
              : {}),
            requestDraftBySlot: { 1: requestDraft },
            requestItemKindBySlot: { 1: requestItemKind },
            requestStatusBySlot: { 1: requestStatus },
            listingDraftBySlot: { 1: listingDraft },
            listingItemKindBySlot: { 1: listingItemKind },
          },
          gameplayActions: {
            buyShopShelfSlot() {
              const shelf = gameplaySnapshot.shop.shelf;
              if (!showUnlockStall || shelf.unlockedSlots > 0) {
                return { ok: false, reason: 'max_slots' };
              }
              if (gameplaySnapshot.coin.current < shelf.nextSlotCost) {
                return { ok: false, reason: 'insufficient_coin' };
              }
              gameplaySnapshot.coin.current -= shelf.nextSlotCost;
              shelf.unlockedSlots = 1;
              shelf.nextSlotNumber = null;
              shelf.nextSlotCost = null;
              shelf.selectedSlotNumber = 1;
              shelf.slots = [{ slotNumber: 1, unlocked: true, batchSize: 1 }];
              page.bind(createViewModel());
              return { ok: true, slotNumber: 1, cost: 50 };
            },
            collectShopDailyCrystalOffer() {
              const offer = gameplaySnapshot.shop.dailyCrystalOffer;
              if (!offer.canCollect) {
                return { ok: false, reason: 'cooldown' };
              }
              if (showCrystalClaimFlyout) {
                transientEffects.emitReward(
                  createRewardFlyoutPresentation({
                    type: 'crystal_collected',
                    crystal: offer.rewardCrystal,
                    source: 'shop_daily_crystal_offer',
                  }),
                );
              }
              offer.canCollect = false;
              offer.cooldownRemainingSeconds = 86_400;
              gameplaySnapshot.crystal.current += offer.rewardCrystal;
              window.__marketRecipeLastDailyCrystalOffer = {
                ok: true,
                crystal: offer.rewardCrystal,
                cooldownSeconds: 86_400,
              };
              page.bind(createViewModel());
              bindTopPanel();
              return window.__marketRecipeLastDailyCrystalOffer;
            },
          },
          actions: {
            ui: {
              clearStall(slotNumber) {
                const slot = gameplaySnapshot.shop.shelf.slots.find(
                  (candidate) => candidate.slotNumber === Number(slotNumber),
                );
                if (!slot) {
                  return { ok: false, reason: 'missing_slot' };
                }
                Object.assign(slot, {
                  sellItemTypeId: null,
                  sellKind: null,
                  sellKey: null,
                  sellLabel: null,
                  loadedQuantity: 0,
                  futureItemTypeId: null,
                  futureItemKind: null,
                  futureItemKey: null,
                  futureItemLabel: null,
                });
                page.bind(createViewModel());
                return { ok: true };
              },
              selectStallItemKind(slotNumber, kind) {
                stallItemKind = kind;
                const nextViewModel = createViewModel();
                page.bind(nextViewModel);
                page.openDialog(
                  SHOP_DIALOG_IDS.STALL,
                  nextViewModel.shop.traders.stalls[
                    Math.max(0, Number(slotNumber) - 1)
                  ].dialog,
                );
                return true;
              },
              setStallTargetQuantityDraft(slotNumber, quantity) {
                stallTargetQuantity = Math.max(
                  0,
                  Math.floor(Number(quantity) || 0),
                );
                const nextViewModel = createViewModel();
                page.bind(nextViewModel);
                page.openDialog(
                  SHOP_DIALOG_IDS.STALL,
                  nextViewModel.shop.traders.stalls[
                    Math.max(0, Number(slotNumber) - 1)
                  ].dialog,
                );
                return true;
              },
              selectLedgerKind(kind) {
                ledgerKind = kind;
                const nextViewModel = createViewModel();
                page.bind(nextViewModel);
                page.openDialog(
                  SHOP_DIALOG_IDS.LEDGER,
                  nextViewModel.shop.dialogs.ledger,
                );
                return true;
              },
              selectMarketBrowseTab(tabId) {
                marketBrowseTab = tabId === 'buying' ? 'buying' : 'selling';
                rebindDialog(SHOP_DIALOG_IDS.MARKET);
                return true;
              },
              setMarketFilterDraft(field, value) {
                marketFilterDraft = {
                  ...marketFilterDraft,
                  [field]: String(value ?? ''),
                };
                return true;
              },
              applyMarketFilters() {
                marketFilterApplied = { ...marketFilterDraft };
                rebindDialog(SHOP_DIALOG_IDS.MARKET);
                return true;
              },
              clearMarketFilters() {
                marketFilterDraft = { item: '', minPrice: '', username: '' };
                marketFilterApplied = { item: '', minPrice: '', username: '' };
                rebindDialog(SHOP_DIALOG_IDS.MARKET);
                return true;
              },
              openMarketBuy(listing) {
                marketBuyListingKey = String(listing?.listingKey ?? '');
                marketBuyQuantity = 1;
                marketBuyStatus = '';
                rebindDialog(SHOP_DIALOG_IDS.BUY);
                return true;
              },
              setMarketBuyQuantity(value) {
                const listing = playerShopSnapshot.listings.find(
                  (candidate) => candidate.listingKey === marketBuyListingKey,
                );
                marketBuyQuantity = Math.max(
                  1,
                  Math.min(
                    Math.max(1, Number(listing?.quantity) || 1),
                    Math.floor(Number(value) || 1),
                  ),
                );
                marketBuyStatus = '';
                rebindDialog(SHOP_DIALOG_IDS.BUY);
                return true;
              },
              confirmMarketBuy(listing, quantity) {
                window.__marketRecipeLastBuy = {
                  listingKey: listing?.listingKey,
                  itemKey: listing?.itemKey,
                  quantity,
                  totalPriceCoin: Number(listing?.priceCoin) * Number(quantity),
                };
                return dialogRegistry.close(SHOP_DIALOG_IDS.BUY);
              },
              selectRequestItem(slotNumber, item) {
                requestItemKind = item.kind;
                requestDraft = {
                  ...requestDraft,
                  itemTypeId: item.itemTypeId,
                  itemKey: item.key,
                  itemLabel: item.label,
                  itemKind: item.kind,
                };
                rebindDialog(SHOP_DIALOG_IDS.REQUEST);
                return true;
              },
              clearPlayerRequest(slotNumber) {
                const index = Math.max(0, Number(slotNumber) - 1);
                const slot = gameplaySnapshot.shop.playerRequests.slots[index];
                gameplaySnapshot.shop.playerRequests.slots[index] = {
                  slotNumber: Number(slotNumber),
                  unlocked: slot?.unlocked !== false,
                };
                page.bind(createViewModel());
                return { ok: true };
              },
              setRequestDraftField(slotNumber, field, value) {
                requestDraft = { ...requestDraft, [field]: value };
                rebindDialog(SHOP_DIALOG_IDS.REQUEST);
                return true;
              },
              selectRequestItemKind(slotNumber, kind) {
                requestItemKind = kind;
                rebindDialog(SHOP_DIALOG_IDS.REQUEST);
                return true;
              },
              selectListingItem(slotNumber, item) {
                listingItemKind = item.kind;
                listingDraft = {
                  ...listingDraft,
                  itemTypeId: item.itemTypeId,
                  itemKey: item.key,
                  itemLabel: item.label,
                  itemKind: item.kind,
                  quantity: Math.max(1, item.quantity),
                };
                rebindDialog(SHOP_DIALOG_IDS.LISTING);
                return true;
              },
              setListingDraftField(slotNumber, field, value) {
                listingDraft = { ...listingDraft, [field]: value };
                rebindDialog(SHOP_DIALOG_IDS.LISTING);
                return true;
              },
              selectListingItemKind(slotNumber, kind) {
                listingItemKind = kind;
                rebindDialog(SHOP_DIALOG_IDS.LISTING);
                return true;
              },
              submitPlayerListing(slotNumber, listing) {
                window.__marketRecipeLastListing = {
                  slotNumber,
                  ...listing,
                };
                return { ok: true };
              },
              clearPlayerListing(slotNumber) {
                const index = Math.max(0, Number(slotNumber) - 1);
                const slot = gameplaySnapshot.shop.playerShelf.slots[index];
                if (slot?.itemTypeId) {
                  gameplaySnapshot.shop.playerShelf.slots[index] = {
                    slotNumber: Number(slotNumber),
                    unlocked: slot.unlocked !== false,
                  };
                  page.bind(createViewModel());
                  window.__marketRecipeLastClear = {
                    slotNumber,
                    result: 'cleared',
                  };
                  return { ok: true };
                }
                transientEffects.emitReward({
                  message: 'Nothing to clear',
                  flyoutKey: `shop-listing-nothing-to-clear-${slotNumber}`,
                });
                window.__marketRecipeLastClear = {
                  slotNumber,
                  result: 'nothing_to_clear',
                };
                return { ok: false, reason: 'nothing_to_clear' };
              },
              closePlayerListingDialog() {
                return dialogRegistry.close(SHOP_DIALOG_IDS.LISTING);
              },
            },
          },
        });
      const viewModel = createViewModel();
      page.bind(viewModel);
      page.activate();
      applicationManager.layers.pageUi.addChild(page.root);
      window.__marketRecipePage = page;
      window.__marketRecipeDialogs = dialogRegistry;
      if (loopSaleShine || loopSaleFlyout) {
        const playSaleEffect = () => {
          page.playStallSaleEffect(1);
          if (loopSaleFlyout) {
            transientEffects.emitReward(
              createRewardFlyoutPresentation({
                type: 'item_sold',
                item: {
                  key: 'sageSeed',
                  label: 'sage seed',
                  kind: 'seed',
                },
                quantity: 2,
                coin: 2,
                slotNumber: 1,
              }),
            );
          }
        };
        playSaleEffect();
        window.setInterval(
          playSaleEffect,
          loopSaleFlyout ? 1_300 : 650,
        );
      }
      if (showStallDialog) {
        page.openDialog(
          SHOP_DIALOG_IDS.STALL,
          viewModel.shop.traders.stalls[0].dialog,
        );
      } else if (showLedgerDialog) {
        page.openDialog(
          SHOP_DIALOG_IDS.LEDGER,
          viewModel.shop.dialogs.ledger,
        );
      } else if (showRequestDialog) {
        page.openDialog(
          SHOP_DIALOG_IDS.REQUEST,
          viewModel.shop.players.requests.slots[0].dialog,
        );
      } else if (showListingDialog) {
        page.openDialog(
          SHOP_DIALOG_IDS.LISTING,
          viewModel.shop.players.market.slots[0].dialog,
        );
      } else if (showMarketDialog) {
        page.openDialog(
          SHOP_DIALOG_IDS.MARKET,
          viewModel.shop.dialogs.market,
        );
      } else if (showBuyDialog) {
        page.openDialog(
          SHOP_DIALOG_IDS.BUY,
          viewModel.shop.dialogs.buy,
        );
      }
    </script>
  </body>
</html>
