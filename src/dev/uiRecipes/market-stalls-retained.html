<!doctype html>
<html
  lang="en"
  data-style-theme="night"
  data-style-font="lilita-one"
  data-style-icons="icons"
>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Wizard retained Market stalls recipe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1c1e26;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Retained Market stall visual recipe"></canvas>

    <script type="module">
      import '@fontsource/lilita-one/400.css';
      import { PixiAssetManager } from '/src/rendering/pixi/assets/PixiAssetManager.js';
      import { PixiInputRouter } from '/src/rendering/pixi/input/PixiInputRouter.js';
      import { SHOP_DIALOG_IDS } from '/src/rendering/pixi/pages/shop/ShopDialogPixi.js';
      import { ShopPixiPage } from '/src/rendering/pixi/pages/shop/ShopPixiPage.js';
      import { createShop } from '/src/rendering/pixi/pages/shop/createShop.js';
      import { DialogRegistry } from '/src/rendering/pixi/retained/DialogRegistry.js';
      import { PixiApplicationManager } from '/src/rendering/pixi/runtime/PixiApplicationManager.js';
      import { TextEntryService } from '/src/rendering/textEntry/TextEntryService.js';

      const gameplaySnapshot = {
        coin: { current: 5770 },
        playerLevel: { currentLevel: 4 },
        research: { completedResearchIds: ['unlockSeed:sageSeed'] },
        shop: {
          market: {
            name: 'Crossroads Market',
            rank: 2,
          },
          coinOffer: {
            rewardCoin: 80,
            canCollect: false,
            cooldownRemainingSeconds: 7_020,
          },
          shelf: {
            autoSellSeconds: 5,
            sellKinds: [
              { kind: 'seed', label: 'seeds' },
              { kind: 'herb', label: 'herbs' },
              { kind: 'potion', label: 'potions' },
            ],
            sellItems: [
              {
                itemTypeId: 1,
                key: 'sageSeed',
                label: 'sage seed',
                kind: 'seed',
                quantity: 0,
                sellCoin: 1,
                sellNeed: 10,
              },
              {
                itemTypeId: 3,
                key: 'briarSeed',
                label: 'briar seed',
                kind: 'seed',
                quantity: 0,
                sellCoin: 5,
                sellNeed: 0,
                targetNeed: 1000,
                maxNeed: 1500,
              },
            ],
            slots: [
              {
                slotNumber: 1,
                unlocked: true,
                sellItemTypeId: 1,
                sellKind: 'seed',
                sellKey: 'sageSeed',
                sellLabel: 'sage seed',
                loadedQuantity: 462,
                batchSize: 1,
                sellCoin: 1,
                sellProgressSeconds: 2.5,
              },
              {
                slotNumber: 2,
                unlocked: true,
                sellItemTypeId: 3,
                sellKind: 'seed',
                sellKey: 'briarSeed',
                sellLabel: 'briar seed',
                loadedQuantity: 144,
                batchSize: 3,
                sellCoin: 5,
                sellNeed: 0,
                targetNeed: 1000,
                maxNeed: 1500,
                tradedHere: true,
                pauseLabel: 'no demand · merchants in 3h 32m',
                sellProgressSeconds: 2.5,
              },
              {
                slotNumber: 3,
                unlocked: true,
                batchSize: 1,
              },
            ],
          },
          playerRequests: {
            slots: [
              {
                slotNumber: 1,
                unlocked: true,
                itemTypeId: 1,
                itemKey: 'sageSeed',
                itemKind: 'seed',
                itemLabel: 'sage seed',
                quantity: 8,
                priceCoin: 5,
              },
              {
                slotNumber: 2,
                unlocked: true,
              },
              {
                slotNumber: 3,
                unlocked: false,
              },
            ],
          },
          playerShelf: {
            sellKinds: [
              { kind: 'seed', label: 'seeds' },
              { kind: 'herb', label: 'herbs' },
              { kind: 'potion', label: 'potions' },
            ],
            sellItems: [
              {
                itemTypeId: 1,
                key: 'sageSeed',
                label: 'sage seed',
                kind: 'seed',
                quantity: 12,
              },
              {
                itemTypeId: 3,
                key: 'briarSeed',
                label: 'briar seed',
                kind: 'seed',
                quantity: 7,
              },
              {
                itemTypeId: 1001,
                key: 'sageHerb',
                label: 'sage',
                kind: 'herb',
                quantity: 4,
              },
            ],
            slots: [
              {
                slotNumber: 1,
                unlocked: true,
                itemTypeId: 3,
                itemKey: 'briarSeed',
                itemKind: 'seed',
                itemLabel: 'briar seed',
                quantity: 4,
                priceCoin: 9,
              },
              {
                slotNumber: 2,
                unlocked: true,
              },
              {
                slotNumber: 3,
                unlocked: false,
              },
            ],
          },
          stock: {
            sellKinds: [
              { kind: 'seed', label: 'seeds' },
              { kind: 'herb', label: 'herbs' },
              { kind: 'potion', label: 'potions' },
            ],
            items: [
              { itemTypeId: 1, key: 'sageSeed', label: 'sage seed', kind: 'seed', stock: 2897, npcNeed: 1294, buyCoin: 8 },
              { itemTypeId: 2, key: 'mintSeed', label: 'mint seed', kind: 'seed', stock: 4194, npcNeed: 1293, buyCoin: 8 },
              { itemTypeId: 3, key: 'nettleSeed', label: 'nettle seed', kind: 'seed', stock: 3992, npcNeed: 1294, buyCoin: 8 },
              { itemTypeId: 4, key: 'lavenderSeed', label: 'lavender seed', kind: 'seed', stock: 5400, npcNeed: 1500, buyCoin: 10 },
              { itemTypeId: 5, key: 'briarSeed', label: 'briar seed', kind: 'seed', stock: 4515, npcNeed: 1500, buyCoin: 11 },
              { itemTypeId: 6, key: 'glowcapSeed', label: 'glowcap seed', kind: 'seed', stock: 3519, npcNeed: 1500, buyCoin: 14 },
              { itemTypeId: 7, key: 'mandrakeSeed', label: 'mandrake seed', kind: 'seed', stock: 3004, npcNeed: 1500, buyCoin: 15 },
              { itemTypeId: 8, key: 'sunrootSeed', label: 'sunroot seed', kind: 'seed', stock: 2745, npcNeed: 1420, buyCoin: 16 },
              { itemTypeId: 9, key: 'moonflowerSeed', label: 'moonflower seed', kind: 'seed', stock: 2412, npcNeed: 1360, buyCoin: 18 },
              { itemTypeId: 10, key: 'frostmossSeed', label: 'frostmoss seed', kind: 'seed', stock: 2106, npcNeed: 1280, buyCoin: 20 },
              { itemTypeId: 11, key: 'dreambellSeed', label: 'dreambell seed', kind: 'seed', stock: 1944, npcNeed: 1220, buyCoin: 22 },
              { itemTypeId: 12, key: 'starAniseSeed', label: 'star anise seed', kind: 'seed', stock: 1788, npcNeed: 1180, buyCoin: 24 },
              { itemTypeId: 1001, key: 'sageHerb', label: 'sage', kind: 'herb', stock: 1822, npcNeed: 980, buyCoin: 18 },
              { itemTypeId: 1002, key: 'mintHerb', label: 'mint', kind: 'herb', stock: 1610, npcNeed: 940, buyCoin: 20 },
              { itemTypeId: 2001, key: 'manaTonic', label: 'mana tonic', kind: 'potion', stock: 811, npcNeed: 620, buyCoin: 28 },
              { itemTypeId: 2002, key: 'minorHealingPotion', label: 'minor healing potion', kind: 'potion', stock: 544, npcNeed: 510, buyCoin: 35 },
            ],
          },
        },
      };
      const playerShopSnapshot = {
        connected: true,
        proceedsCoin: 42,
        listings: [],
        ownListings: [],
        requests: [],
        ownRequests: [],
        tradeHistory: [],
      };

      const canvas = document.querySelector('canvas');
      const query = new URLSearchParams(window.location.search);
      const dialogQuery = query.get('dialog');
      const selectedTabId = ['traders', 'players', 'crystals'].includes(
        query.get('tab'),
      )
        ? query.get('tab')
        : ['request', 'listing'].includes(dialogQuery)
          ? 'players'
          : 'traders';
      if (query.get('proceeds') === 'none') {
        playerShopSnapshot.proceedsCoin = 0;
      }
      if (query.get('requests') === 'empty') {
        gameplaySnapshot.shop.playerRequests.slots = [
          { slotNumber: 1, unlocked: true },
        ];
      }
      if (query.get('coinOffer') === 'ready') {
        gameplaySnapshot.shop.coinOffer.canCollect = true;
        gameplaySnapshot.shop.coinOffer.cooldownRemainingSeconds = 0;
      }
      const showStallDialog = dialogQuery === 'stall';
      const showLedgerDialog = dialogQuery === 'ledger';
      const showRequestDialog = dialogQuery === 'request';
      const showListingDialog = dialogQuery === 'listing';
      const showOverflowItems = query.get('items') === 'overflow';
      const loopSaleShine = query.get('saleShine') === 'loop';
      if (query.get('categories') === 'seed') {
        for (const catalogue of [
          gameplaySnapshot.shop.shelf,
          gameplaySnapshot.shop.playerShelf,
          gameplaySnapshot.shop.stock,
        ]) {
          catalogue.sellKinds = catalogue.sellKinds.filter(
            (kind) => kind.kind === 'seed',
          );
        }
      }
      const stallCount = Math.max(
        0,
        Math.floor(Number(query.get('count')) || 0),
      );
      const showNotifiedEmptyStall =
        query.get('stalls') === 'empty-notified';
      if (query.get('stalls') === 'full') {
        const slotTemplates = gameplaySnapshot.shop.shelf.slots;
        gameplaySnapshot.shop.shelf.slots = Array.from(
          { length: 5 },
          (_, index) => ({
            ...slotTemplates[index % slotTemplates.length],
            slotNumber: index + 1,
          }),
        );
      }
      if (query.get('stalls') === 'single') {
        gameplaySnapshot.shop.shelf.slots =
          gameplaySnapshot.shop.shelf.slots.slice(0, 1);
      }
      if (showNotifiedEmptyStall) {
        gameplaySnapshot.shop.shelf.sellItems[0].quantity = 5;
        gameplaySnapshot.shop.shelf.slots = [
          {
            slotNumber: 1,
            unlocked: true,
            batchSize: 1,
          },
        ];
      }
      if (showStallDialog) {
        if (showOverflowItems) {
          const overflowSeeds =
            gameplaySnapshot.shop.stock.items
              .filter((item) => item.kind === 'seed')
              .slice(0, 8);
          gameplaySnapshot.shop.shelf.sellItems =
            overflowSeeds.map((item, index) => ({
              ...item,
              quantity: 119 + index * 73,
              sellCoin: Math.max(1, item.buyCoin - 2),
              sellNeed: item.npcNeed,
            }));
          gameplaySnapshot.research.completedResearchIds =
            overflowSeeds.map((item) => `unlockSeed:${item.key}`);
        }
        gameplaySnapshot.shop.shelf.sellItems[0].quantity = 119;
        gameplaySnapshot.shop.shelf.slots[0].loadedQuantity = 10;
        if (query.has('count')) {
          gameplaySnapshot.shop.shelf.sellItems[0].quantity = stallCount;
          gameplaySnapshot.shop.shelf.slots[0].loadedQuantity = 0;
        }
      }
      const applicationManager = new PixiApplicationManager({ canvas });
      const assetManager = new PixiAssetManager();
      const inputRouter = new PixiInputRouter();
      const textEntryService = new TextEntryService({ canvas });

      await Promise.all([
        applicationManager.initialize(),
        assetManager.loadAll(),
      ]);
      inputRouter.mount({
        root: applicationManager.getApplication().stage,
        canvas,
      });

      const dialogRegistry = new DialogRegistry();
      const page = new ShopPixiPage({
        assetManager,
        dialogLayer: applicationManager.layers.dialogsSource,
        dialogRegistry,
        inputRouter,
        textEntryService,
      });
      let ledgerKind = 'seed';
      let stallItemKind = 'seed';
      let stallTargetQuantity = query.has('count')
        ? stallCount
        : 32;
      let requestItemKind = 'seed';
      let listingItemKind = 'seed';
      let requestDraft = {
        itemTypeId: 1,
        itemKey: 'sageSeed',
        itemLabel: 'sage seed',
        itemKind: 'seed',
        quantity: 30,
        priceCoin: 7,
      };
      let listingDraft = {
        itemTypeId: 1,
        itemKey: 'sageSeed',
        itemLabel: 'sage seed',
        itemKind: 'seed',
        quantity: 5,
        priceCoin: 9,
      };
      const rebindDialog = (dialogId) => {
        const nextViewModel = createViewModel();
        page.bind(nextViewModel);
        const dialog =
          dialogId === SHOP_DIALOG_IDS.REQUEST
            ? nextViewModel.shop.players.requests.slots[0].dialog
            : nextViewModel.shop.players.market.slots[0].dialog;
        page.openDialog(dialogId, dialog);
      };
      const createViewModel = () =>
        createShop({
          gameplaySnapshot,
          playerShopSnapshot,
          notificationSnapshot: showNotifiedEmptyStall
            ? {
                active: true,
                tone: 'orange',
                children: {
                  npcListing: 'orange',
                },
              }
            : null,
          selectedTabId,
          uiState: {
            ledgerKind,
            ...(showStallDialog
              ? {
                  stallTargetQuantityBySlot: {
                    1: stallTargetQuantity,
                  },
                  stallItemKindBySlot: { 1: stallItemKind },
                }
              : {}),
            requestDraftBySlot: { 1: requestDraft },
            requestItemKindBySlot: { 1: requestItemKind },
            listingDraftBySlot: { 1: listingDraft },
            listingItemKindBySlot: { 1: listingItemKind },
          },
          actions: {
            ui: {
              selectStallItemKind(slotNumber, kind) {
                stallItemKind = kind;
                const nextViewModel = createViewModel();
                page.bind(nextViewModel);
                page.openDialog(
                  SHOP_DIALOG_IDS.STALL,
                  nextViewModel.shop.traders.stalls[
                    Math.max(0, Number(slotNumber) - 1)
                  ].dialog,
                );
                return true;
              },
              setStallTargetQuantityDraft(slotNumber, quantity) {
                stallTargetQuantity = Math.max(
                  0,
                  Math.floor(Number(quantity) || 0),
                );
                const nextViewModel = createViewModel();
                page.bind(nextViewModel);
                page.openDialog(
                  SHOP_DIALOG_IDS.STALL,
                  nextViewModel.shop.traders.stalls[
                    Math.max(0, Number(slotNumber) - 1)
                  ].dialog,
                );
                return true;
              },
              selectLedgerKind(kind) {
                ledgerKind = kind;
                const nextViewModel = createViewModel();
                page.bind(nextViewModel);
                page.openDialog(
                  SHOP_DIALOG_IDS.LEDGER,
                  nextViewModel.shop.dialogs.ledger,
                );
                return true;
              },
              selectRequestItem(slotNumber, item) {
                requestItemKind = item.kind;
                requestDraft = {
                  ...requestDraft,
                  itemTypeId: item.itemTypeId,
                  itemKey: item.key,
                  itemLabel: item.label,
                  itemKind: item.kind,
                };
                rebindDialog(SHOP_DIALOG_IDS.REQUEST);
                return true;
              },
              setRequestDraftField(slotNumber, field, value) {
                requestDraft = { ...requestDraft, [field]: value };
                rebindDialog(SHOP_DIALOG_IDS.REQUEST);
                return true;
              },
              selectRequestItemKind(slotNumber, kind) {
                requestItemKind = kind;
                rebindDialog(SHOP_DIALOG_IDS.REQUEST);
                return true;
              },
              selectListingItem(slotNumber, item) {
                listingItemKind = item.kind;
                listingDraft = {
                  ...listingDraft,
                  itemTypeId: item.itemTypeId,
                  itemKey: item.key,
                  itemLabel: item.label,
                  itemKind: item.kind,
                  quantity: Math.max(1, item.quantity),
                };
                rebindDialog(SHOP_DIALOG_IDS.LISTING);
                return true;
              },
              setListingDraftField(slotNumber, field, value) {
                listingDraft = { ...listingDraft, [field]: value };
                rebindDialog(SHOP_DIALOG_IDS.LISTING);
                return true;
              },
              selectListingItemKind(slotNumber, kind) {
                listingItemKind = kind;
                rebindDialog(SHOP_DIALOG_IDS.LISTING);
                return true;
              },
            },
          },
        });
      const viewModel = createViewModel();
      page.bind(viewModel);
      page.activate();
      applicationManager.layers.pageUi.addChild(page.root);
      window.__marketRecipePage = page;
      window.__marketRecipeDialogs = dialogRegistry;
      if (loopSaleShine) {
        page.playStallSaleEffect(1);
        window.setInterval(() => page.playStallSaleEffect(1), 650);
      }
      if (showStallDialog) {
        page.openDialog(
          SHOP_DIALOG_IDS.STALL,
          viewModel.shop.traders.stalls[0].dialog,
        );
      } else if (showLedgerDialog) {
        page.openDialog(
          SHOP_DIALOG_IDS.LEDGER,
          viewModel.shop.dialogs.ledger,
        );
      } else if (showRequestDialog) {
        page.openDialog(
          SHOP_DIALOG_IDS.REQUEST,
          viewModel.shop.players.requests.slots[0].dialog,
        );
      } else if (showListingDialog) {
        page.openDialog(
          SHOP_DIALOG_IDS.LISTING,
          viewModel.shop.players.market.slots[0].dialog,
        );
      }
    </script>
  </body>
</html>
