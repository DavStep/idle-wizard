<!doctype html>
<html
  lang="en"
  data-style-theme="night"
  data-style-font="lilita-one"
  data-style-icons="icons"
>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Wizard World Event dialog recipe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1c1e26;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas aria-label="World Event dialog visual recipe"></canvas>

    <script type="module">
      import '@fontsource/lilita-one/400.css';
      import { PixiAssetManager } from '/src/rendering/pixi/assets/PixiAssetManager.js';
      import { PixiInputRouter } from '/src/rendering/pixi/input/PixiInputRouter.js';
      import { WorkshopPixiPage } from '/src/rendering/pixi/pages/workshop/WorkshopPixiPage.js';
      import { DialogRegistry } from '/src/rendering/pixi/retained/DialogRegistry.js';
      import { SemanticTargetRegistry } from '/src/rendering/pixi/retained/SemanticTargetRegistry.js';
      import { PixiApplicationManager } from '/src/rendering/pixi/runtime/PixiApplicationManager.js';

      const canvas = document.querySelector('canvas');
      const applicationManager = new PixiApplicationManager({ canvas });
      const assetManager = new PixiAssetManager();
      const inputRouter = new PixiInputRouter();

      await Promise.all([
        applicationManager.initialize(),
        assetManager.loadAll(),
      ]);
      inputRouter.mount({
        root: applicationManager.getApplication().stage,
        canvas,
      });

      const dialogRegistry = new DialogRegistry();
      const semanticTargets = new SemanticTargetRegistry();
      const page = new WorkshopPixiPage({
        assetManager,
        dialogLayer: applicationManager.layers.dialogsSource,
        dialogRegistry,
        inputRouter,
        semanticTargets,
      });
      let donationAmount = 1;
      const model = {
        workshop: {
          tasks: {
            rows: [
              {
                id: 'recipe-task',
                label: 'Brew Calming Draught',
                current: 4,
                required: 24,
              },
            ],
          },
          dialogs: {
            worldEvent: {
              header: {
                body: 'Bells ring from towers that disagreed yesterday.\nNew clerks ask every workshop to prove the town still moves and read the new edicts.',
                headline: 'New King Crowned',
                meta: '0 points · 4d 2h',
              },
              rowWidget: 'worldEventQuest',
              rows: [
                {
                  description: 'The coronation bells have people cheering, arguing, and fainting in the same street. Donate calming draughts so the crowd stays upright long enough for the heralds to finish.',
                  donationOptions: [
                    {
                      actionLabel: 'Donate',
                      enabled: true,
                      id: 'calming-draught',
                      itemKey: 'calmingDraught',
                      itemKind: 'potion',
                      label: 'Calming Draught',
                      onActivate: openDonation,
                      pointsEachLabel: '120 points each',
                      resourceKey: 'potion',
                      semanticId: 'workshop.worldEvent.quest.crowd.donation.calmingDraught',
                      totalLabel: '0 points total',
                    },
                    {
                      actionLabel: 'Donate',
                      enabled: true,
                      id: 'valerian-rest',
                      itemKey: 'valerianRest',
                      itemKind: 'potion',
                      label: 'Valerian Rest',
                      onActivate: openDonation,
                      pointsEachLabel: '320 points each',
                      resourceKey: 'potion',
                      semanticId: 'workshop.worldEvent.quest.crowd.donation.valerianRest',
                      totalLabel: '0 points total',
                    },
                  ],
                  id: 'quest:quiet-the-crowd',
                  pointsLabel: '0 points',
                  title: 'Quiet The Crowd',
                },
                {
                  description: 'The new seal is crossing town in a box that everyone wants to touch. Donate warding potions so the seal reaches the hall without a new scandal.',
                  donationOptions: [
                    {
                      actionLabel: 'Donate',
                      enabled: true,
                      id: 'briar-ward',
                      itemKey: 'briarWard',
                      itemKind: 'potion',
                      label: 'Briar Ward',
                      onActivate: openDonation,
                      pointsEachLabel: '180 points each',
                      resourceKey: 'potion',
                      semanticId: 'workshop.worldEvent.quest.seal.donation.briarWard',
                      totalLabel: '0 points total',
                    },
                  ],
                  id: 'quest:protect-the-seal',
                  pointsLabel: '0 points',
                  title: 'Protect The Seal',
                },
              ],
              selectedTabId: 'tasks',
              tabs: [
                { id: 'tasks', label: 'Quests', selected: true },
                { id: 'leaderboard', label: 'Leaderboard' },
                { id: 'rewards', label: 'Rewards' },
              ],
              title: 'World Event',
            },
            worldEventDonate: createDonationModel(),
          },
        },
      };
      const worldEventQuestRows = model.workshop.dialogs.worldEvent.rows;
      const worldEventLeaderboardRows = [
        ['c00p', 'mira', 'violet', 'DBP', 'violet', 30, 3, '1,302,270'],
        ['ftwizard', 'elara', 'sun', 'DBP', 'amber', 30, 2, '1,162,530'],
        ['Azalea', 'juniper', 'emerald', 'SW', 'green', 15, 1, '1,129,463'],
        ['ShaeZard', 'rowan', 'classic', '', 'ink', 21, 0, '32,821'],
        ['Gandalf The Green', 'bramble', 'classic', '', 'ink', 17, 0, '2,391'],
        ['notinvi', 'corvin', 'bronze', '', 'ink', 9, 0, '539'],
        ['DageTheEvil', 'juniper', 'classic', '', 'ink', 5, 0, '55'],
        ['StepWizzard', 'mira', 'emerald', 'WIZ', 'blue', 34, 3, '12'],
      ].map((entry, index) => ({
        id: `world-event-player-${index}`,
        type: 'leaderboardPlayer',
        rank: index + 1,
        username: entry[0],
        character: entry[1],
        frame: entry[2],
        allianceTag: entry[3],
        allianceTagColor: entry[4],
        playerLevel: entry[5],
        prestigeCount: entry[6],
        current: index === 0,
        totalMetric: 'points',
        totalLabel: entry[7],
      }));
      const worldEventRewardRows = [
        { id: 'qualification', label: 'Leaderboard Rewards', value: 'Qualified' },
        { id: 'rank-1', label: 'Rank 1', value: '5 emerald · 10 crystal' },
        { id: 'rank-2', label: 'Rank 2', value: '3 emerald · 7 crystal' },
      ];

      function selectWorldEventTab(tabId) {
        const dialog = model.workshop.dialogs.worldEvent;
        dialog.selectedTabId = tabId;
        dialog.rowWidget = tabId === 'tasks'
          ? 'worldEventQuest'
          : tabId === 'leaderboard'
            ? 'leaderboard'
            : 'default';
        dialog.rows = tabId === 'tasks'
          ? worldEventQuestRows
          : tabId === 'leaderboard'
            ? worldEventLeaderboardRows
            : worldEventRewardRows;
        dialog.tabs = dialog.tabs.map((tab) => ({
          ...tab,
          selected: tab.id === tabId,
          onSelect: selectWorldEventTab,
        }));
        page.bind(model);
        return true;
      }
      model.workshop.dialogs.worldEvent.tabs =
        model.workshop.dialogs.worldEvent.tabs.map((tab) => ({
          ...tab,
          onSelect: selectWorldEventTab,
        }));

      function openDonation() {
        page.openDialog('worldEventDonate');
        return true;
      }

      function createDonationModel() {
        const points = donationAmount * 120;
        return {
          title: 'Quiet The Crowd',
          featuredItem: {
            id: 'giving',
            label: 'Calming Draught',
            detail: 'Owned',
            value: '12',
            itemKind: 'potion',
            itemKey: 'calmingDraught',
            iconSize: 36,
          },
          summaryRows: [
            {
              id: 'total',
              label: 'Already Donated',
              value: '0 points',
            },
            {
              id: 'amount',
              label: 'Amount',
              value: `${donationAmount} / 12`,
            },
            {
              id: 'points',
              label: 'Earn',
              value: `+${points} points`,
              valueTone: 'root',
            },
          ],
          range: {
            enabled: true,
            tone: 'root',
            min: 1,
            max: 12,
            step: 1,
            value: donationAmount,
            onChange: setDonationAmount,
          },
          actions: [
            {
              id: 'confirm',
              label: `Donate x${donationAmount}`,
              variant: 'green',
              enabled: true,
              action: confirmDonation,
            },
          ],
        };
      }

      function setDonationAmount(nextAmount) {
        donationAmount = Math.max(1, Math.min(12, Math.round(nextAmount)));
        model.workshop.dialogs.worldEventDonate = createDonationModel();
        page.bind(model);
        return true;
      }

      function confirmDonation() {
        dialogRegistry.close('workshop.worldEventDonate');
        return true;
      }

      page.layout(applicationManager.projection);
      const searchParams = new URLSearchParams(window.location.search);
      const requestedTab = searchParams.get('tab');
      if (['tasks', 'leaderboard', 'rewards'].includes(requestedTab)) {
        selectWorldEventTab(requestedTab);
      }
      page.bind(model);
      page.activate();
      applicationManager.layers.pageUi.addChild(page.root);
      const requestedDialog = searchParams.get('dialog');
      page.openDialog(requestedDialog === 'donate' ? 'worldEventDonate' : 'worldEvent');

      window.__worldEventRecipe = {
        applicationManager,
        dialogRegistry,
        page,
        semanticTargets,
      };
    </script>
  </body>
</html>
