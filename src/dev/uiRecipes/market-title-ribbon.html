<!doctype html>
<html
  lang="en"
  data-style-theme="night"
  data-style-font="lilita-one"
  data-style-icons="icons"
>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Wizard Market title ribbon recipe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #17191f;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Market title ribbon visual recipe"></canvas>

    <script type="module">
      import '@fontsource/lilita-one/400.css';
      import { PixiAssetManager } from '/src/rendering/pixi/assets/PixiAssetManager.js';
      import { MarketTitleRibbon } from '/src/rendering/pixi/pages/shop/MarketTitleRibbon.js';
      import { PixiApplicationManager } from '/src/rendering/pixi/runtime/PixiApplicationManager.js';
      import { PIXI_ROOT_RUN_ASSETS } from '/src/rendering/pixi/theme/PixiThemeTokens.js';

      const canvas = document.querySelector('canvas');
      const applicationManager = new PixiApplicationManager({ canvas });
      const assetManager = new PixiAssetManager();

      await Promise.all([
        applicationManager.initialize(),
        assetManager.loadAll(),
      ]);

      const ribbon = new MarketTitleRibbon({
        assetManager,
        assetId: PIXI_ROOT_RUN_ASSETS.marketTitleRibbonRed,
      });
      ribbon.bind('Small Town Market', 1);
      ribbon.setMaxWidth(applicationManager.projection.sourceWidth);
      ribbon.root.position.set(
        (applicationManager.projection.sourceWidth - ribbon.width) / 2,
        96,
      );
      applicationManager.layers.pageUi.addChild(ribbon.root);
    </script>
  </body>
</html>
