<!doctype html>
<html
  lang="en"
  data-style-theme="night"
  data-style-font="lilita-one"
  data-style-icons="icons"
>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Wizard prestige World Chat recipe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1c1e26;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Prestige World Chat visual recipe"></canvas>

    <script type="module">
      import '@fontsource/lilita-one/400.css';
      import { PixiAssetManager } from '/src/rendering/pixi/assets/PixiAssetManager.js';
      import { PixiInputRouter } from '/src/rendering/pixi/input/PixiInputRouter.js';
      import { WorkshopDialogPixi } from '/src/rendering/pixi/pages/workshop/WorkshopDialogPixi.js';
      import { SemanticTargetRegistry } from '/src/rendering/pixi/retained/SemanticTargetRegistry.js';
      import { PixiApplicationManager } from '/src/rendering/pixi/runtime/PixiApplicationManager.js';

      const PRESTIGE_ICON_ASSET =
        'source:assets/icons/icon-prestige-star.png';
      const keyboardInset = Math.max(
        0,
        Number(
          new URLSearchParams(window.location.search).get('keyboardInset'),
        ) || 0,
      );
      const canvas = document.querySelector('canvas');
      const applicationManager = new PixiApplicationManager({ canvas });
      const assetManager = new PixiAssetManager();
      const inputRouter = new PixiInputRouter();

      await Promise.all([
        applicationManager.initialize(),
        assetManager.loadAll(),
      ]);
      inputRouter.mount({
        root: applicationManager.getApplication().stage,
        canvas,
      });

      const semanticTargets = new SemanticTargetRegistry();
      const dialog = new WorkshopDialogPixi({
        dialogId: 'workshop.worldChat',
        assetManager,
        inputRouter,
        onClose: () => false,
        parent: applicationManager.layers.dialogsSource,
        semanticTargets,
      });
      dialog.bind({
        title: 'World Chat',
        composer: {
          placeholder: 'Message',
          maxLength: 160,
          enabled: true,
        },
        rows: [
          ...Array.from({ length: 10 }, (_, index) => ({
            id: `preview-history-${index}`,
            type: 'system',
            username: 'System',
            body: `Wizard reached level ${index + 2}.`,
            ageLabel: `${53 - index * 4}m ago`,
          })),
          {
            id: 'preview-player',
            type: 'player',
            username: 'Mira',
            body: 'The moon garden is glowing tonight.',
            allianceTag: 'MOSS',
            allianceTagColor: 'green',
            character: 'mira',
            frame: 'emerald',
            ageLabel: '3m ago',
          },
          {
            id: 'preview-system',
            type: 'system',
            username: 'System',
            body: 'The weekly world event has begun.',
            ageLabel: '1m ago',
          },
          {
            id: 'preview-prestige',
            type: 'system',
            username: 'System',
            body: 'Ada reached ⭐ 4, completing prestige level 40',
            systemPlayerUsername: 'Ada',
            systemPlayerDetail:
              'reached ⭐ 4, completing prestige level 40',
            bodyRuns: [
              {
                kind: 'text',
                text: 'reached ',
              },
              {
                kind: 'icon',
                assetId: PRESTIGE_ICON_ASSET,
                fallbackText: '⭐',
                label: 'Prestige star',
                size: 12,
              },
              {
                kind: 'text',
                text: ' 4, completing prestige level 40',
              },
            ],
            ageLabel: 'now',
          },
          {
            id: 'preview-own-player',
            type: 'player',
            isOwn: true,
            username: 'You',
            body: 'I will join the next expedition from the moon garden.',
            allianceTag: 'ARC',
            allianceTagColor: 'violet',
            character: 'elara',
            ageLabel: 'now',
          },
        ],
        onSubmit: async () => ({ ok: false, reason: 'offline' }),
      });
      let projection = applicationManager.projection;
      if (keyboardInset > 0) {
        applicationManager.setTextEntryActive(true);
        projection = applicationManager.setKeyboardMetrics({
          keyboardInset,
          visibleHeight: Math.max(0, canvas.clientHeight - keyboardInset),
        });
      }
      dialog.layout(projection);
      dialog.activate();

      window.__worldChatPrestigeRecipe = {
        applicationManager,
        dialog,
        semanticTargets,
      };
    </script>
  </body>
</html>
