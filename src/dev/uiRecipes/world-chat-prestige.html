<!doctype html>
<html
  lang="en"
  data-style-theme="night"
  data-style-font="lilita-one"
  data-style-icons="icons"
>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Wizard rich World Chat recipe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1c1e26;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Rich World Chat visual recipe"></canvas>

    <script type="module">
      import '@fontsource/lilita-one/400.css';
      import { PixiAssetManager } from '/src/rendering/pixi/assets/PixiAssetManager.js';
      import { PixiInputRouter } from '/src/rendering/pixi/input/PixiInputRouter.js';
      import { WorkshopDialogPixi } from '/src/rendering/pixi/pages/workshop/WorkshopDialogPixi.js';
      import { PixiViewModelFactory } from '/src/rendering/pixi/presenters/PixiViewModelFactory.js';
      import { SemanticTargetRegistry } from '/src/rendering/pixi/retained/SemanticTargetRegistry.js';
      import { PixiApplicationManager } from '/src/rendering/pixi/runtime/PixiApplicationManager.js';
      import { TextEntryService } from '/src/rendering/textEntry/TextEntryService.js';

      const keyboardInset = Math.max(
        0,
        Number(
          new URLSearchParams(window.location.search).get('keyboardInset'),
        ) || 0,
      );
      const canvas = document.querySelector('canvas');
      const applicationManager = new PixiApplicationManager({ canvas });
      const assetManager = new PixiAssetManager();
      const inputRouter = new PixiInputRouter();
      const textEntryService = new TextEntryService({ canvas });

      await Promise.all([
        applicationManager.initialize(),
        assetManager.loadAll(),
      ]);
      inputRouter.mount({
        root: applicationManager.getApplication().stage,
        canvas,
      });

      const semanticTargets = new SemanticTargetRegistry();
      const dialog = new WorkshopDialogPixi({
        dialogId: 'workshop.worldChat',
        assetManager,
        inputRouter,
        onClose: () => false,
        parent: applicationManager.layers.dialogsSource,
        semanticTargets,
        textEntryService,
      });
      const prestigeRow = new PixiViewModelFactory().createWorldChatDialog(
        {
          connected: true,
          messages: [
            {
              id: 'preview-prestige',
              senderIdentity: 'preview-ada',
              username: 'System',
              body: 'Ada reached ⭐ 4, completing prestige level 40',
              character: 'mira',
              frame: 'violet',
              sentAtMs: Date.now(),
            },
          ],
        },
        {
          openPlayer: (player) => {
            canvas.dataset.playerInfoUsername = player.username;
            return true;
          },
        },
      ).rows[0];
      dialog.bind({
        title: 'World Chat',
        composer: {
          placeholder: 'Message',
          maxLength: 160,
          enabled: true,
        },
        rows: [
          ...Array.from({ length: 10 }, (_, index) => ({
            id: `preview-history-${index}`,
            type: 'system',
            username: 'System',
            body: `Wizard reached level ${index + 2}.`,
            ageLabel: `${53 - index * 4}m ago`,
          })),
          {
            id: 'preview-player',
            type: 'player',
            username: 'Mira',
            body: 'The moon garden is glowing tonight.',
            allianceTag: 'MOSS',
            allianceTagColor: 'green',
            character: 'mira',
            frame: 'emerald',
            ageLabel: '3m ago',
          },
          {
            id: 'preview-system',
            type: 'system',
            username: 'System',
            body: 'The weekly world event has begun.',
            ageLabel: '1m ago',
          },
          prestigeRow,
          {
            id: 'preview-own-player',
            type: 'player',
            isOwn: true,
            username: 'You',
            body: 'I will join the next expedition from the moon garden.',
            allianceTag: 'ARC',
            allianceTagColor: 'violet',
            character: 'elara',
            ageLabel: 'now',
          },
          {
            id: 'preview-inline-avatar',
            type: 'system',
            username: 'System',
            systemPlayerUsername: 'Mira',
            body: 'Welcome Mira to the alliance.',
            bodyRuns: [
              { kind: 'text', text: 'Welcome ' },
              {
                kind: 'widget',
                widget: 'playerAvatar',
                character: 'mira',
                frame: 'violet',
                fallbackText: '[Mira]',
                label: 'Mira avatar',
                size: 18,
              },
              { kind: 'text', text: ' Mira to the alliance.' },
            ],
            ageLabel: 'now',
            onActivate: () => {
              window.__inlineAvatarActivated =
                (window.__inlineAvatarActivated ?? 0) + 1;
              canvas.dataset.inlineAvatarActivated = String(
                window.__inlineAvatarActivated,
              );
              return true;
            },
          },
        ],
        onSubmit: async () => ({ ok: false, reason: 'offline' }),
      });
      let projection = applicationManager.projection;
      if (keyboardInset > 0) {
        applicationManager.setTextEntryActive(true);
        projection = applicationManager.setKeyboardMetrics({
          keyboardInset,
          visibleHeight: Math.max(0, canvas.clientHeight - keyboardInset),
        });
      }
      dialog.layout(projection);
      dialog.activate();

      window.__worldChatPrestigeRecipe = {
        applicationManager,
        dialog,
        semanticTargets,
      };
    </script>
  </body>
</html>
