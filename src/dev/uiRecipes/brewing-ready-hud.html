<!doctype html>
<html
  lang="en"
  data-style-theme="night"
  data-style-font="lilita-one"
  data-style-icons="icons"
>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Wizard brewing ready HUD recipe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1c1e26;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Brewing ready HUD visual recipe"></canvas>
    <output
      id="brewing-ready-hud-recipe-state"
      hidden
      data-phase="Ready to Brew"
      data-potion-background="#0e1016"
      data-slot-labels="Sage,Sage,Sage"
      data-phase-texture-padding="16"
    ></output>

    <script type="module">
      import '@fontsource/lilita-one/400.css';
      import {
        PixiTransientEffectsLayer,
        createRewardFlyoutPresentation,
      } from '/src/rendering/pixi/global/transient/PixiTransientEffectsLayer.js';
      import { BrewingHudPixi } from '/src/rendering/pixi/pages/brewing/BrewingHudPixi.js';
      import { PixiBottomPanelView } from '/src/rendering/pixi/global/chrome/PixiBottomPanelView.js';
      import { PixiWorldChatView } from '/src/rendering/pixi/global/chrome/PixiWorldChatView.js';
      import { PixiInputRouter } from '/src/rendering/pixi/input/PixiInputRouter.js';
      import { PixiApplicationManager } from '/src/rendering/pixi/runtime/PixiApplicationManager.js';
      import { PixiUiRuntimeFacade } from '/src/rendering/pixi/runtime/PixiUiRuntimeFacade.js';

      const parameters = new URLSearchParams(location.search);
      const requestedTheme = parameters.get('theme');
      if (requestedTheme) {
        document.documentElement.dataset.styleTheme = requestedTheme;
      }
      const canvas = document.querySelector('canvas');
      const recipeState = document.querySelector(
        '#brewing-ready-hud-recipe-state',
      );
      const inputRouter = new PixiInputRouter();
      const applicationManager = new PixiApplicationManager({ canvas });
      const runtime = new PixiUiRuntimeFacade({
        applicationManager,
        inputRouter,
      });
      await runtime.initialize();
      const transientEffects = new PixiTransientEffectsLayer({
        assets: runtime.assetManager,
        application: applicationManager.getApplication(),
        parent: applicationManager.getLayers().transient,
        semanticRegistry: runtime.semanticRegistry,
      });
      transientEffects.applyTheme(runtime.themeManager.getSnapshot());
      transientEffects.activate();
      const state = parameters.get('state');
      const missingIngredients = parameters.get('availability') === 'missing';
      const emptyCauldron = state === 'empty';
      const autoWaiting = parameters.get('auto') === 'waiting';
      const useLongPotionName = parameters.get('longName') === 'true';
      const cauldronCount = Math.min(
        5,
        Math.max(1, Math.floor(Number(parameters.get('cauldrons')) || 1)),
      );
      const selectedCauldronIndex = Math.min(
        cauldronCount - 1,
        Math.max(
          0,
          Math.floor(Number(parameters.get('selectedCauldron')) || 1) - 1,
        ),
      );
      const activeBrew =
        state === 'active'
          ? {
              key: 'healingPotion',
              label: 'healing potion',
              phase: 'brewing',
              totalMs: 60_000,
              remainingMs: 57_000,
              progress: 0.05,
            }
          : state === 'collect'
            ? {
                key: 'manaTonic',
                label: 'mana tonic',
                phase: 'ready',
                canCollect: true,
                totalMs: 60_000,
                remainingMs: 0,
                progress: 1,
              }
            : null;

      const hud = new BrewingHudPixi({
        assetManager: runtime.assetManager,
        inputRouter,
        semanticTargets: runtime.semanticRegistry,
        theme: runtime.themeManager.getSnapshot(),
      });
      applicationManager.getLayers().pageUi.addChild(hud.root);
      const cauldronModel = {
        cauldronNumber: 1,
        level: 1,
        unlocked: true,
        selectedRecipe: emptyCauldron ? null : {
          key:
            activeBrew?.key ??
            (useLongPotionName
              ? 'minorHealingPotion'
              : 'manaTonic'),
          label:
            activeBrew?.label ??
            (useLongPotionName
              ? 'minor healing potion'
              : 'mana tonic'),
          rarity: 'common',
          ownedQuantity: 0,
          ingredients: [
            {
              slotIndex: 0,
              itemTypeId: 1001,
              itemKey: 'sageHerb',
              key: 'sageHerb',
              label: 'sage',
              quantity: 1,
              owned: 1,
            },
            {
              slotIndex: 1,
              itemTypeId: 1001,
              itemKey: 'sageHerb',
              key: 'sageHerb',
              label: 'sage',
              quantity: 1,
              owned: 1,
            },
            {
              slotIndex: 2,
              itemTypeId: 1001,
              itemKey: 'sageHerb',
              key: 'sageHerb',
              label: 'sage',
              quantity: 1,
              owned: missingIngredients ? 0 : 1,
            },
          ],
        },
        ingredients: [],
        activeBrew,
        autoBrewEnabled: autoWaiting,
        autoBrewArmed: autoWaiting,
        recipeReadiness: emptyCauldron ? null : {
          hasEnoughIngredients: !missingIngredients,
          hasEnoughMana: true,
        },
        canAddIngredient: true,
        canSelectRecipe: true,
        acceptsHerbDrop: true,
        primaryAction: {
          id: emptyCauldron ? 'recipes' : 'brew',
          label: emptyCauldron ? 'Choose Recipe' : 'Brew',
          enabled: emptyCauldron || !missingIngredients,
        },
      };
      const hudModel = {
        selectedCauldronIndex,
        configuredMaxCauldrons: 5,
        cauldrons: Array.from({ length: cauldronCount }, (_, index) => ({
          ...cauldronModel,
          cauldronNumber: index + 1,
        })),
      };
      const hudActions = {
        collectBrew: () => {
          const result = transientEffects.emitReward(
            createRewardFlyoutPresentation({
              id: 'brewing-ready-hud-potion',
              type: 'potion_collected',
              cauldronIndex: selectedCauldronIndex,
              potion: {
                key: activeBrew?.key ?? 'manaTonic',
                label: activeBrew?.label ?? 'mana tonic',
              },
              quantity: 1,
            }),
          );
          recipeState.dataset.collects = String(
            Number(recipeState.dataset.collects ?? 0) + 1,
          );
          recipeState.dataset.rewardDrops = String(
            result.visualCount,
          );
          return { ok: true };
        },
        performCauldronAction: () => {
          if (missingIngredients) {
            return false;
          }
          recipeState.dataset.brewStarts = String(
            Number(recipeState.dataset.brewStarts ?? 0) + 1,
          );
          return true;
        },
        emptyCauldron: () => {
          const cauldron = hudModel.cauldrons[selectedCauldronIndex];
          cauldron.selectedRecipe = null;
          cauldron.ingredients = [];
          recipeState.dataset.empty = 'true';
          hud.bind(hudModel, hudActions);
          return true;
        },
      };
      hud.bind(hudModel, hudActions);
      const projection = applicationManager.getProjection();
      hud.layout(projection.sourceWidth, projection.sourceHeight, {
        worldChatVisible: true,
      });
      transientEffects.layout(projection);
      const worldChat = new PixiWorldChatView({
        assets: runtime.assetManager,
        inputRouter,
      });
      applicationManager.getLayers().globalChrome.addChild(worldChat.root);
      worldChat.layout(projection);
      worldChat.applyTheme(runtime.themeManager.getSnapshot());
      worldChat.bind({
        label: 'World Chat',
        messages: [
          { body: 'Azalea reached level 11', username: 'system' },
          { body: 'Wizteria reached level 6', username: 'system' },
        ],
        visible: true,
      });
      worldChat.activate();
      const bottomPanel = new PixiBottomPanelView({
        assets: runtime.assetManager,
        inputRouter,
        semanticRegistry: runtime.semanticRegistry,
      });
      applicationManager.getLayers().globalChrome.addChild(bottomPanel.root);
      bottomPanel.layout(projection);
      bottomPanel.applyTheme(runtime.themeManager.getSnapshot());
      bottomPanel.bind({
        currentPageId: 'brewing',
        pages: ['brewing', 'garden', 'workshop', 'shop', 'research'].map(
          (id) => ({ id, unlocked: true, visible: true }),
        ),
      });
      bottomPanel.activate();
      const detailBottom =
        hud.detailPanel.root.y + hud.detailPanel.height;
      const chatTitleTop =
        worldChat.panel.root.y -
        worldChat.panel.root.pivot.y -
        12;
      recipeState.dataset.detailToChatGap = String(
        chatTitleTop - detailBottom,
      );
      const chatBottom =
        worldChat.panel.root.y -
        worldChat.panel.root.pivot.y +
        worldChat.panel.height;
      recipeState.dataset.chatToTabsGap = String(
        bottomPanel.tabsRoot.y - chatBottom,
      );
      recipeState.dataset.previewTopGap = String(
        hud.carouselPanel.root.y +
          hud.ingredientSlots[0].root.y -
          (hud.recipes.root.y + hud.recipes.height),
      );
      if (parameters.get('repeatTheme') === 'true') {
        hud.applyTheme(runtime.themeManager.getSnapshot());
        hud.applyTheme(runtime.themeManager.getSnapshot());
      }
      if (activeBrew) {
        const requestedMotionFrame = parameters.get('motionMs');
        const requestedMotionMs = Number(requestedMotionFrame);
        const hasRequestedMotionFrame =
          requestedMotionFrame !== null &&
          Number.isFinite(requestedMotionMs);
        const updateHudMotion = (now) => {
          hud.updateMotion(now, {
            active: true,
            reducedMotion: parameters.get('reducedMotion') === 'true',
          });
          recipeState.dataset.progress = hud.progress.progress.toFixed(4);
        };
        if (hasRequestedMotionFrame) {
          applicationManager.getApplication().ticker.stop();
          updateHudMotion(
            hud.cauldronMotionModeStartedAt + requestedMotionMs,
          );
          const rest = hud.cauldronChangeRestState;
          recipeState.dataset.cauldronArtOffsetY = String(
            hud.cauldronArt.y - rest.art.y,
          );
          recipeState.dataset.cauldronLiquidOffsetY = String(
            hud.cauldronLiquid.y - rest.liquid.y,
          );
          recipeState.dataset.cauldronArtScaleX = String(
            hud.cauldronArt.scale.x / rest.art.scaleX,
          );
          recipeState.dataset.cauldronLiquidScaleX = String(
            hud.cauldronLiquid.scale.x / rest.liquid.scaleX,
          );
          recipeState.dataset.cauldronArtScaleY = String(
            hud.cauldronArt.scale.y / rest.art.scaleY,
          );
          recipeState.dataset.cauldronLiquidScaleY = String(
            hud.cauldronLiquid.scale.y / rest.liquid.scaleY,
          );
          applicationManager.getApplication().renderer.render(
            applicationManager.getApplication().stage,
          );
        } else {
          applicationManager.getApplication().ticker.add(() => {
            updateHudMotion(Date.now());
          });
        }
      }
      recipeState.dataset.state = state ?? 'ready';
      recipeState.dataset.phase = hud.phaseLabel.text;
      recipeState.dataset.progressVisible = String(hud.progress.root.visible);
      recipeState.dataset.primaryAction = hud.brew.text.text;
      recipeState.dataset.missingIngredients = hud.missingIngredientViews
        .filter((view) => view.root.visible)
        .map((view) => `${view.label.text} ${view.count.text}`)
        .join(',');
      recipeState.dataset.empty = 'false';
      recipeState.dataset.visibleSlotText = hud.ingredientSlots
        .map((slot) => slot.name.text)
        .filter(Boolean)
        .join(',');
      recipeState.dataset.visibleSlotCounts = hud.ingredientSlots
        .map((slot) => slot.requiredQuantity?.text ?? '')
        .filter(Boolean)
        .join(',');
      recipeState.dataset.hearthWoodVisible = String(
        hud.cauldronHearth.wood.visible && hud.cauldronHearth.root.visible,
      );
      recipeState.dataset.hearthLitMix = hud.cauldronHearth.litMix.toFixed(4);
      recipeState.dataset.hearthFlameAlpha =
        hud.cauldronHearth.flameFront.alpha.toFixed(4);
      recipeState.dataset.hearthSparkHeight =
        hud.cauldronHearth.sparks.getLocalBounds().height.toFixed(4);
      if (
        state === 'collect' &&
        parameters.get('frame') === 'mid'
      ) {
        applicationManager.getApplication().ticker.stop();
        hud.activatePrimaryAction();
        transientEffects.tick(260);
        recipeState.dataset.activeRewardDrops = String(
          transientEffects.getStats().active.item,
        );
        applicationManager.getApplication().renderer.render(
          applicationManager.getApplication().stage,
        );
      }
      window.__brewingReadyHudRecipe = hud;
      window.__brewingReadyWorldChatRecipe = worldChat;
      window.__brewingReadyTransientEffectsRecipe = transientEffects;
      window.__brewingReadyBottomPanelRecipe = bottomPanel;
    </script>
  </body>
</html>
