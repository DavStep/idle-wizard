<!doctype html>
<html
  lang="en"
  data-style-theme="night"
  data-style-font="lilita-one"
  data-style-icons="icons"
>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Wizard brewing ready HUD recipe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1c1e26;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Brewing ready HUD visual recipe"></canvas>
    <output
      id="brewing-ready-hud-recipe-state"
      hidden
      data-phase="Ready to Brew"
      data-potion-background="#0e1016"
      data-slot-labels="Sage,Sage,Sage"
      data-phase-texture-padding="16"
    ></output>

    <script type="module">
      import '@fontsource/lilita-one/400.css';
      import { BrewingHudPixi } from '/src/rendering/pixi/pages/brewing/BrewingHudPixi.js';
      import { PixiWorldChatView } from '/src/rendering/pixi/global/chrome/PixiWorldChatView.js';
      import { PixiInputRouter } from '/src/rendering/pixi/input/PixiInputRouter.js';
      import { PixiApplicationManager } from '/src/rendering/pixi/runtime/PixiApplicationManager.js';
      import { PixiUiRuntimeFacade } from '/src/rendering/pixi/runtime/PixiUiRuntimeFacade.js';

      const parameters = new URLSearchParams(location.search);
      const requestedTheme = parameters.get('theme');
      if (requestedTheme) {
        document.documentElement.dataset.styleTheme = requestedTheme;
      }
      const canvas = document.querySelector('canvas');
      const recipeState = document.querySelector(
        '#brewing-ready-hud-recipe-state',
      );
      const inputRouter = new PixiInputRouter();
      const applicationManager = new PixiApplicationManager({ canvas });
      const runtime = new PixiUiRuntimeFacade({
        applicationManager,
        inputRouter,
      });
      await runtime.initialize();
      const state = parameters.get('state');
      const useLongPotionName = parameters.get('longName') === 'true';
      const activeBrew =
        state === 'active'
          ? {
              key: 'healingPotion',
              label: 'healing potion',
              phase: 'brewing',
              totalMs: 60_000,
              remainingMs: 57_000,
              progress: 0.05,
            }
          : null;

      const hud = new BrewingHudPixi({
        assetManager: runtime.assetManager,
        inputRouter,
        semanticTargets: runtime.semanticRegistry,
        theme: runtime.themeManager.getSnapshot(),
      });
      applicationManager.getLayers().pageUi.addChild(hud.root);
      const hudModel = {
        selectedCauldronIndex: 0,
        configuredMaxCauldrons: 5,
        cauldrons: [
          {
            cauldronNumber: 1,
            level: 1,
            unlocked: true,
            selectedRecipe: {
              key:
                activeBrew?.key ??
                (useLongPotionName
                  ? 'minorHealingPotion'
                  : 'manaTonic'),
              label:
                activeBrew?.label ??
                (useLongPotionName
                  ? 'minor healing potion'
                  : 'mana tonic'),
              rarity: 'common',
              ownedQuantity: 0,
              ingredients: [
                {
                  slotIndex: 0,
                  itemTypeId: 1001,
                  itemKey: 'sageHerb',
                  key: 'sageHerb',
                  label: 'sage',
                  quantity: 1,
                  owned: 44,
                },
                {
                  slotIndex: 1,
                  itemTypeId: 1001,
                  itemKey: 'sageHerb',
                  key: 'sageHerb',
                  label: 'sage',
                  quantity: 1,
                  owned: 44,
                },
                {
                  slotIndex: 2,
                  itemTypeId: 1001,
                  itemKey: 'sageHerb',
                  key: 'sageHerb',
                  label: 'sage',
                  quantity: 1,
                  owned: 44,
                },
              ],
            },
            ingredients: [],
            activeBrew,
            canAddIngredient: true,
            canSelectRecipe: true,
            acceptsHerbDrop: true,
            primaryAction: {
              id: 'brew',
              label: 'Brew',
              enabled: true,
            },
          },
        ],
      };
      const hudActions = {
        emptyCauldron: () => {
          const cauldron = hudModel.cauldrons[0];
          cauldron.selectedRecipe = null;
          cauldron.ingredients = [];
          recipeState.dataset.empty = 'true';
          hud.bind(hudModel, hudActions);
          return true;
        },
      };
      hud.bind(hudModel, hudActions);
      const projection = applicationManager.getProjection();
      hud.layout(projection.sourceWidth, projection.sourceHeight, {
        worldChatVisible: true,
      });
      const worldChat = new PixiWorldChatView({
        assets: runtime.assetManager,
        inputRouter,
      });
      applicationManager.getLayers().globalChrome.addChild(worldChat.root);
      worldChat.layout(projection);
      worldChat.applyTheme(runtime.themeManager.getSnapshot());
      worldChat.bind({
        label: 'World Chat',
        messages: [
          { body: 'Azalea reached level 11', username: 'system' },
          { body: 'Wizteria reached level 6', username: 'system' },
        ],
        visible: true,
      });
      worldChat.activate();
      const detailBottom =
        hud.detailPanel.root.y + hud.detailPanel.height;
      const chatTitleTop =
        worldChat.panel.root.y -
        worldChat.panel.root.pivot.y -
        12;
      recipeState.dataset.detailToChatGap = String(
        chatTitleTop - detailBottom,
      );
      recipeState.dataset.previewTopGap = String(
        hud.carouselPanel.root.y +
          hud.ingredientSlots[0].root.y -
          (hud.recipes.root.y + hud.recipes.height),
      );
      if (parameters.get('repeatTheme') === 'true') {
        hud.applyTheme(runtime.themeManager.getSnapshot());
        hud.applyTheme(runtime.themeManager.getSnapshot());
      }
      if (activeBrew) {
        applicationManager.getApplication().ticker.add(() => {
          hud.updateMotion(Date.now(), {
            active: true,
            reducedMotion: parameters.get('reducedMotion') === 'true',
          });
          recipeState.dataset.progress = hud.progress.progress.toFixed(4);
        });
      }
      recipeState.dataset.state = state ?? 'ready';
      recipeState.dataset.empty = 'false';
      recipeState.dataset.visibleSlotText = hud.ingredientSlots
        .map((slot) => slot.name.text)
        .filter(Boolean)
        .join(',');
      window.__brewingReadyHudRecipe = hud;
      window.__brewingReadyWorldChatRecipe = worldChat;
    </script>
  </body>
</html>
